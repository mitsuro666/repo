<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>乙抓repo模板</title>
  <style>
    @font-face {
      font-family: "BlackSugarPlumCandy";
      src: url("./font/BlackSugarPlumCandy-Bold.ttf") format("truetype");
      font-weight: 400 900;
      font-style: normal;
      font-display: swap;
    }

    :root {
      --ink: #5d4051;
      --muted: #9b7a8d;
      --rose: #d95f8c;
      --rose-deep: #b84570;
      --cream: #fff8f6;
      --mint: #87b9aa;
      --gold: #d7a64a;
      --shadow: 0 18px 45px rgba(123, 68, 91, 0.18);
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      color: var(--ink);
      font-family: "BlackSugarPlumCandy", "Microsoft YaHei", "PingFang SC", "Noto Sans CJK SC", Arial, sans-serif;
      background:
        radial-gradient(circle at 12% 8%, rgba(255, 238, 220, 0.95), transparent 30%),
        radial-gradient(circle at 88% 18%, rgba(214, 235, 229, 0.9), transparent 28%),
        linear-gradient(135deg, #fff1f5 0%, #f8fbf4 48%, #fff8ed 100%);
    }

    button, input, textarea { font: inherit; }

    body * {
      font-family: inherit;
    }

    .app {
      min-height: 100vh;
      padding: 24px 18px 36px;
      display: grid;
      justify-items: center;
      gap: 12px;
    }

    .site-title {
      width: min(100%, 1080px);
      margin: 0;
      color: var(--rose-deep);
      font-size: 32px;
      font-weight: 900;
      line-height: 1.1;
      text-align: center;
    }

    .toolbar {
      width: min(100%, 1080px);
      min-height: 44px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      flex-wrap: nowrap;
    }

    .toolbar-actions {
      display: flex;
      align-items: center;
      justify-content: flex-end;
      gap: 8px;
      flex-wrap: nowrap;
    }

    .action-button {
      min-height: 40px;
      border: 1px solid rgba(217, 95, 140, 0.32);
      border-radius: 999px;
      padding: 0 16px;
      color: var(--rose-deep);
      background: rgba(255, 255, 255, 0.8);
      box-shadow: 0 8px 18px rgba(184, 69, 112, 0.12);
      cursor: pointer;
    }

    .action-button.primary {
      color: #fff;
      border-color: transparent;
      background: linear-gradient(135deg, #d95f8c, #c84c79);
    }

    .template-switch {
      display: flex;
      align-items: center;
      gap: 6px;
      margin-right: 0;
      padding: 4px;
      border: 1px solid rgba(217, 95, 140, 0.24);
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.66);
    }

    .template-button {
      min-height: 32px;
      border: 0;
      border-radius: 999px;
      padding: 0 14px;
      color: var(--rose-deep);
      background: transparent;
      cursor: pointer;
    }

    .template-button.active {
      color: #fff;
      background: linear-gradient(135deg, #d95f8c, #b84570);
      box-shadow: 0 6px 13px rgba(184, 69, 112, 0.14);
    }

    .stage {
      width: min(100%, 1080px);
      overflow: visible;
      padding: 8px;
    }

    .card {
      position: relative;
      width: 1080px;
      height: 1440px;
      overflow: hidden;
      transform-origin: top left;
      background:
        linear-gradient(90deg, rgba(255, 255, 255, 0.36) 1px, transparent 1px) 0 0 / 36px 36px,
        linear-gradient(rgba(255, 255, 255, 0.32) 1px, transparent 1px) 0 0 / 36px 36px,
        linear-gradient(145deg, #fff7f4 0%, #fffdf9 48%, #f2faf3 100%);
      border: 0;
      border-radius: 44px;
      box-shadow: var(--shadow);
    }

    .card::before {
      content: "";
      position: absolute;
      inset: 26px;
      border: 3px solid rgba(242, 183, 201, 0.78);
      border-radius: 30px;
      pointer-events: none;
    }

    .card::after {
      content: "";
      position: absolute;
      inset: 54px;
      border: 2px dashed rgba(135, 185, 170, 0.42);
      border-radius: 22px;
      pointer-events: none;
    }

    .editable, .soft-input, .soft-area {
      border: 0;
      outline: 0;
      color: var(--ink);
      background: transparent;
    }

    .editable {
      min-height: 1.2em;
      white-space: pre-wrap;
      overflow-wrap: anywhere;
    }

    .editable *,
    .tag * {
      color: inherit !important;
      background: transparent !important;
      font: inherit !important;
      text-decoration: none !important;
    }

    .editable:empty::before { content: ""; }
    .title-panel .editable:empty::before {
      content: attr(data-placeholder);
      color: rgba(155, 122, 141, 0.48);
    }
    .soft-input { width: 100%; min-width: 0; }
    .soft-input::placeholder, .soft-area::placeholder { color: transparent; }
    #recordAuthor::placeholder {
      color: rgba(155, 122, 141, 0.58);
    }

    .soft-area {
      width: 100%;
      height: 100%;
      box-sizing: border-box;
      padding: 0;
      resize: none;
      line-height: 1.32;
      overflow: auto;
      scrollbar-width: thin;
      scrollbar-color: rgba(217, 95, 140, 0.38) transparent;
      display: block;
    }

    .soft-area::-webkit-scrollbar {
      width: 8px;
    }

    .soft-area::-webkit-scrollbar-thumb {
      border-radius: 999px;
      background: rgba(217, 95, 140, 0.38);
    }

    .soft-area::-webkit-scrollbar-track {
      background: transparent;
    }

    .card-header { display: none; }

    .meta-chip { display: none; }

    .title-panel {
      position: absolute;
      left: 92px;
      top: 453px;
      width: 900px;
      height: 112px;
      z-index: 2;
      padding: 28px 22px 16px;
      border: 2px solid rgba(242, 183, 201, 0.54);
      border-radius: 26px;
      background: rgba(255, 255, 255, 0.58);
    }

    .record-title {
      color: var(--ink);
      font-size: 26px;
      font-weight: 900;
      line-height: 1.3;
      outline: 0;
    }

    .cover-box {
      position: absolute;
      left: 92px;
      top: 94px;
      width: 420px;
      height: 315px;
      z-index: 2;
      border: 4px solid #fff;
      border-radius: 24px;
      overflow: hidden;
      background:
        linear-gradient(135deg, rgba(255, 224, 234, 0.76), rgba(232, 246, 239, 0.86)),
        repeating-linear-gradient(-45deg, rgba(255,255,255,.5) 0 12px, transparent 12px 24px);
      box-shadow: 0 14px 24px rgba(128, 76, 95, 0.16);
      cursor: pointer;
    }

    .cover-box img {
      width: 100%;
      height: 100%;
      display: none;
      object-fit: contain;
      object-position: center;
      background: rgba(255, 255, 255, 0.52);
    }

    .cover-box.has-image img { display: block; }

    .cover-placeholder {
      position: absolute;
      inset: 0;
      display: grid;
      place-items: center;
      text-align: center;
      color: var(--rose-deep);
      font-size: 28px;
      font-weight: 800;
      line-height: 1.45;
    }

    .cover-box.has-image .cover-placeholder { display: none; }
    .cover-placeholder .compact-size { display: none; }
    .card.compact .cover-placeholder .full-size { display: none; }
    .card.compact .cover-placeholder .compact-size { display: inline; }

    .cover-tools {
      position: absolute;
      left: 156px;
      top: 369px;
      width: 292px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 5px;
      z-index: 4;
      padding: 5px 7px;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.72);
      backdrop-filter: blur(8px);
      box-shadow: 0 6px 14px rgba(128, 76, 95, 0.12);
      opacity: 1;
      pointer-events: auto;
      transition: opacity 120ms ease;
    }

    .cover-box:hover + .cover-tools,
    .cover-tools:hover,
    .cover-tools:focus-within {
      opacity: 1;
      pointer-events: auto;
    }

    .tiny-button {
      border: 1px solid rgba(135, 185, 170, 0.42);
      border-radius: 999px;
      padding: 3px 7px;
      color: #4c7e70;
      background: rgba(255, 255, 255, 0.88);
      font-size: 12px;
      cursor: pointer;
    }

    .info-panel {
      position: absolute;
      left: 536px;
      top: 94px;
      width: 456px;
      height: 315px;
      z-index: 2;
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      align-content: start;
      gap: 14px 18px;
      padding: 48px 24px 14px;
      border: 2px solid rgba(242, 183, 201, 0.6);
      border-radius: 26px;
      background: rgba(255, 255, 255, 0.58);
    }

    .panel-title,
    .price-label,
    .rating-section-label,
    .review-label {
      position: absolute;
      top: -21px;
      left: 18px;
      z-index: 3;
      padding: 7px 22px 8px;
      border-radius: 999px;
      color: #fff;
      background: linear-gradient(135deg, #d95f8c, #b84570);
      font-size: 24px;
      font-weight: 900;
      line-height: 1;
      box-shadow: 0 6px 14px rgba(184, 69, 112, 0.18);
    }

    .panel-title {
      position: absolute;
      top: -21px;
      left: 18px;
      z-index: 3;
      padding: 7px 22px 8px;
      border-radius: 999px;
      color: #fff;
      background: linear-gradient(135deg, #d95f8c, #b84570);
      font-size: 24px;
      font-weight: 900;
      line-height: 1;
      box-shadow: 0 6px 14px rgba(184, 69, 112, 0.18);
    }

    .title-field {
      grid-column: 1 / -1;
    }

    .price-label,
    .rating-section-label {
      position: absolute;
      top: -21px;
      left: 18px;
      z-index: 3;
      padding: 7px 22px 8px;
      border-radius: 999px;
      color: #fff;
      background: linear-gradient(135deg, #d95f8c, #b84570);
      font-size: 24px;
      font-weight: 900;
      line-height: 1;
      box-shadow: 0 6px 14px rgba(184, 69, 112, 0.18);
    }

    .review-label {
      margin-bottom: 12px;
    }

    .title-field .editable {
      color: var(--rose-deep);
      font-size: 22px;
      font-weight: 900;
      line-height: 1.24;
    }

    .field {
      position: relative;
      display: grid;
      grid-template-columns: 1fr;
      grid-template-rows: 22px 14px 31px;
      align-items: start;
      height: 67px;
      row-gap: 0;
      padding-bottom: 0;
      overflow: visible;
      align-content: start;
    }

    .field::after {
      content: "";
      grid-column: 1;
      grid-row: 2;
      align-self: center;
      width: 100%;
      border-bottom: 1px dashed rgba(217, 95, 140, 0.32);
      pointer-events: none;
    }

    .cn-field {
      grid-column: 1 / -1;
      height: 86px;
      grid-template-rows: 22px 22px 34px;
    }

    .field-label-row {
      grid-column: 1;
      grid-row: 1;
      display: flex;
      align-items: flex-start;
      gap: 8px;
      min-width: 0;
      position: relative;
      z-index: 2;
    }

    .field label {
      color: var(--rose);
      font-size: 21px;
      font-weight: 800;
      position: relative;
      z-index: 1;
    }

    .import-button {
      min-height: 22px;
      border: 1px solid rgba(217, 95, 140, 0.36);
      border-radius: 999px;
      padding: 0 9px;
      color: var(--rose-deep);
      background: rgba(255, 255, 255, 0.82);
      font-size: 13px;
      font-weight: 800;
      line-height: 20px;
      cursor: pointer;
      white-space: nowrap;
      box-shadow: 0 5px 12px rgba(217, 95, 140, 0.12);
    }

    .import-button:disabled {
      opacity: 0.62;
      cursor: default;
    }

    .info-panel .field label {
      transform: translateY(-3px);
    }

    .field .editable, .field .soft-input {
      font-size: 26px;
      font-weight: 900;
      line-height: 1.08;
      position: relative;
      z-index: 1;
      padding-top: 0;
      grid-column: 1;
      grid-row: 3;
      min-height: 31px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .price-panel {
      position: absolute;
      left: 92px;
      top: 748px;
      width: 420px;
      height: 220px;
      z-index: 2;
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 11px 12px;
      padding: 34px 18px 16px;
      border: 2px solid rgba(242, 183, 201, 0.54);
      border-radius: 26px;
      background: rgba(255, 255, 255, 0.58);
    }

    .metric {
      min-height: 68px;
      padding: 8px 11px;
      border-radius: 18px;
      border: 2px solid rgba(135, 185, 170, 0.28);
      background: rgba(255, 255, 255, 0.66);
      display: grid;
      align-content: center;
      gap: 3px;
    }

    .metric-entry {
      display: flex;
      align-items: baseline;
      min-width: 0;
      gap: 0;
    }

    .metric-suffix {
      color: var(--ink);
      font-size: 22px;
      font-weight: 900;
      white-space: nowrap;
    }

    .metric-label {
      color: #5f9587;
      font-size: 18px;
      font-weight: 800;
    }

    .metric-value, .metric input {
      color: var(--ink);
      font-size: 26px;
      font-weight: 900;
    }

    .metric-entry input {
      width: auto;
      min-width: 0;
      flex: 0 0 46px;
      max-width: 46px;
    }

    .choice-group {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 4px;
    }

    .cn-field .choice-group {
      grid-column: 1;
      grid-row: 3;
      width: 260px;
    }

    .choice-button {
      min-height: 34px;
      border: 1px solid rgba(217, 95, 140, 0.26);
      border-radius: 999px;
      color: var(--muted);
      background: rgba(255, 255, 255, 0.62);
      padding: 0 4px;
      font-size: 15px;
      font-weight: 900;
      line-height: 1;
      white-space: nowrap;
      cursor: pointer;
    }

    .choice-button.active {
      color: #fff;
      border-color: transparent;
      background: linear-gradient(135deg, #d95f8c, #bf4773);
      box-shadow: 0 6px 13px rgba(184, 69, 112, 0.16);
    }

    .ratings {
      position: absolute;
      left: 536px;
      top: 748px;
      width: 456px;
      height: 220px;
      z-index: 2;
      display: grid;
      align-content: start;
      gap: 9px;
      padding: 33px 24px 17px;
      border: 2px solid rgba(242, 183, 201, 0.54);
      border-radius: 26px;
      background: rgba(255, 255, 255, 0.58);
    }

    .rating-row {
      display: grid;
      grid-template-columns: 70px 1fr;
      align-items: center;
      gap: 8px;
    }

    .rating-label {
      color: var(--rose-deep);
      font-size: 24px;
      font-weight: 900;
    }

    .stars {
      display: grid;
      grid-template-columns: repeat(5, 34px);
      gap: 7px;
      justify-content: start;
    }

    .star {
      border: 0;
      padding: 0;
      width: 34px;
      height: 34px;
      color: rgba(217, 95, 140, 0.32);
      background: rgba(255, 255, 255, 0.7);
      border-radius: 50%;
      box-shadow: inset 0 0 0 2px rgba(242, 183, 201, 0.32);
      font-size: 23px;
      line-height: 34px;
      cursor: pointer;
      transition: transform 120ms ease, color 120ms ease, background 120ms ease;
    }

    .star.active {
      color: #fff;
      background: linear-gradient(135deg, #f5b5ca, #d95f8c);
      box-shadow:
        inset 0 -3px 0 rgba(160, 59, 98, 0.16),
        0 5px 10px rgba(184, 69, 112, 0.18);
      text-shadow: 0 1px 0 rgba(160, 59, 98, 0.25);
    }

    .star:hover { transform: translateY(-1px) scale(1.04); }

    .tags-panel {
      position: absolute;
      left: 92px;
      top: 606px;
      width: 900px;
      height: 105px;
      z-index: 2;
      padding: 34px 30px 16px 18px;
      border: 2px solid rgba(242, 183, 201, 0.54);
      border-radius: 26px;
      background: rgba(255, 255, 255, 0.58);
      overflow: visible;
    }

    .section-label {
      position: absolute;
      top: -21px;
      left: 18px;
      z-index: 3;
      padding: 7px 22px 8px;
      border-radius: 999px;
      color: #fff;
      background: linear-gradient(135deg, #d95f8c, #b84570);
      font-size: 24px;
      font-weight: 900;
      line-height: 1;
      box-shadow: 0 6px 14px rgba(184, 69, 112, 0.18);
    }

    .tags {
      display: flex;
      align-items: flex-start;
      flex-wrap: nowrap;
      gap: 9px;
      height: 54px;
      overflow: visible;
      padding-right: 4px;
    }

    .tag-chip {
      position: relative;
      display: inline-flex;
      align-items: center;
      width: max-content;
      flex: 0 0 auto;
    }

    .tag {
      border: 1px solid rgba(217, 95, 140, 0.24);
      border-radius: 999px;
      padding: 6px 12px;
      color: var(--rose-deep);
      background: rgba(255, 244, 248, 0.82);
      font-size: 21px;
      font-weight: 900;
      outline: 0;
    }

    .tag-remove {
      position: absolute;
      top: -10px;
      right: -10px;
      width: 20px;
      height: 20px;
      border: 0;
      border-radius: 999px;
      color: #fff;
      background: rgba(217, 95, 140, 0.86);
      font-size: 13px;
      font-weight: 900;
      line-height: 19px;
      cursor: pointer;
      box-shadow: 0 3px 8px rgba(184, 69, 112, 0.2);
      opacity: 0;
      pointer-events: none;
      transition: opacity 120ms ease;
    }

    .tag-chip:hover .tag-remove,
    .tag-chip:focus-within .tag-remove {
      opacity: 1;
      pointer-events: auto;
    }

    .add-tag {
      width: 42px;
      height: 42px;
      border: 0;
      border-radius: 999px;
      color: #fff;
      background: var(--mint);
      font-size: 28px;
      line-height: 1;
      cursor: pointer;
      opacity: 1;
      pointer-events: auto;
      transition: opacity 120ms ease;
      flex: 0 0 auto;
    }

    .tags-panel:hover .add-tag,
    .tags-panel:focus-within .add-tag {
      opacity: 1;
      pointer-events: auto;
    }

    .review-panel {
      position: absolute;
      left: 92px;
      top: 1008px;
      width: 900px;
      height: 340px;
      z-index: 2;
      padding: 28px 22px 20px;
      border: 2px solid rgba(217, 95, 140, 0.28);
      border-radius: 28px;
      background: rgba(255, 255, 255, 0.62);
    }

    .review-panel .soft-area {
      font-size: 24px;
      color: var(--ink);
    }


    .card.compact {
      width: 600px;
      height: 800px;
      border-width: 0;
      border-radius: 30px;
    }

    .card.compact::before,
    .card.compact::after { display: none; }
    .card.compact .cover-box { left: 20px; top: 20px; width: 560px; height: 420px; border: 0; border-radius: 0; background: transparent; box-shadow: none; }
    .card.compact .cover-placeholder { font-size: 26px; background: rgba(255,232,240,.62); }
    .card.compact .cover-box img { background: transparent; object-fit: contain; }
    .card.compact .cover-tools { left: 150px; top: 398px; width: 300px; gap: 5px; padding: 5px 7px; }
    .card.compact .tiny-button { font-size: 12px; padding: 3px 7px; }
    .card.compact .title-panel { left: 20px; top: 450px; width: 560px; height: 88px; padding: 0; border: 0; border-radius: 0; background: transparent; }
    .card.compact .title-label,
    .card.compact .panel-title,
    .card.compact .section-label,
    .card.compact .price-label,
    .card.compact .rating-section-label,
    .card.compact .review-label { display: none; }
    .card.compact .record-title { font-size: 21px; line-height: 1.35; text-align: center; white-space: normal; overflow: hidden; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; }
    .card.compact .info-panel { left: 20px; top: 542px; width: 560px; height: 120px; grid-template-columns: repeat(3, 1fr); gap: 0; padding: 0; border: 0; border-radius: 0; background: transparent; }
    .card.compact .info-panel .field { grid-template-rows: 24px 8px 34px; height: 76px; padding: 0 12px; }
    .card.compact .info-panel .field::after { border-bottom-color: rgba(217, 95, 140, 0.28); }
    .card.compact .info-panel .field label { font-size: 18px; transform: none; text-align: center; }
    .card.compact .info-panel .field .editable { font-size: 22px; min-height: 28px; line-height: 1.1; text-align: center; }
    .card.compact .info-panel .field:has(#rjText) { order: 1; }
    .card.compact .info-panel .field:has(#cvText) { order: 2; }
    .card.compact .info-panel .field:has(#circleText) { order: 3; }
    .card.compact .info-panel .field:has(#durationText),
    .card.compact .info-panel .cn-field { display: none; }
    .card.compact .field-label-row { width: 100%; justify-content: center; }
    .card.compact .info-panel .field:has(#rjText) .import-button {
      position: absolute;
      left: 50%;
      top: 62px;
      transform: translateX(-50%);
      min-height: 24px;
      padding: 0 11px;
      font-size: 14px;
      line-height: 23px;
      white-space: nowrap;
      box-shadow: 0 6px 13px rgba(184, 69, 112, 0.14);
    }
    .card.compact .tags-panel,
    .card.compact .price-panel,
    .card.compact .ratings,
    .card.compact .review-panel { display: none; }
    .card.compact .player-deco { display: block; }

    .player-deco { display: none; }

    .player-deco {
      position: absolute;
      left: 58px;
      top: 648px;
      width: 484px;
      height: 86px;
      z-index: 2;
      color: var(--ink);
    }

    .player-bar {
      position: absolute;
      left: 0;
      top: 4px;
      width: 484px;
      height: 8px;
      border-radius: 999px;
      background: rgba(242, 183, 201, 0.34);
      overflow: hidden;
      cursor: pointer;
      touch-action: none;
    }

    .player-bar-fill {
      width: 0%;
      height: 100%;
      border-radius: inherit;
      background: linear-gradient(90deg, rgba(217, 95, 140, 0.88), rgba(245, 181, 202, 0.96));
    }

    .player-dot {
      position: absolute;
      left: 0;
      top: 0;
      width: 16px;
      height: 16px;
      border-radius: 999px;
      background: #fff;
      border: 3px solid rgba(217, 95, 140, 0.7);
      box-shadow: 0 4px 10px rgba(184, 69, 112, 0.16);
      cursor: grab;
      touch-action: none;
    }

    .player-dot:active { cursor: grabbing; }

    .player-time {
      position: absolute;
      top: 22px;
      color: rgba(93, 64, 81, 0.68);
      font-size: 14px;
      font-weight: 800;
      line-height: 1;
      min-width: 48px;
      outline: none;
    }

    .player-time:focus {
      color: var(--rose-deep);
      text-shadow: 0 2px 10px rgba(217, 95, 140, 0.16);
    }

    .player-time.end { right: 0; }

    .player-controls {
      position: absolute;
      left: 70px;
      right: 70px;
      top: 42px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .player-icon {
      position: relative;
      width: 34px;
      height: 34px;
      padding: 0;
      border: 0;
      color: rgba(184, 69, 112, 0.78);
      background: transparent;
      cursor: pointer;
    }

    .player-icon.prev,
    .player-icon.next {
      background-color: currentColor;
      mask-position: center;
      mask-repeat: no-repeat;
      mask-size: 30px 30px;
      -webkit-mask-position: center;
      -webkit-mask-repeat: no-repeat;
      -webkit-mask-size: 30px 30px;
    }

    .player-icon.prev {
      mask-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 32 32' xmlns='http://www.w3.org/2000/svg'%3E%3Cg fill='black'%3E%3Crect x='6' y='8' width='4' height='16' rx='2'/%3E%3Cpath d='M24 8.8c1.4-.9 3.2.1 3.2 1.8v10.8c0 1.7-1.8 2.7-3.2 1.8l-8.2-5.4c-1.2-.8-1.2-2.6 0-3.4L24 8.8Z'/%3E%3C/g%3E%3C/svg%3E");
      -webkit-mask-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 32 32' xmlns='http://www.w3.org/2000/svg'%3E%3Cg fill='black'%3E%3Crect x='6' y='8' width='4' height='16' rx='2'/%3E%3Cpath d='M24 8.8c1.4-.9 3.2.1 3.2 1.8v10.8c0 1.7-1.8 2.7-3.2 1.8l-8.2-5.4c-1.2-.8-1.2-2.6 0-3.4L24 8.8Z'/%3E%3C/g%3E%3C/svg%3E");
    }

    .player-icon.next {
      mask-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 32 32' xmlns='http://www.w3.org/2000/svg'%3E%3Cg fill='black'%3E%3Crect x='22' y='8' width='4' height='16' rx='2'/%3E%3Cpath d='M8 8.8c-1.4-.9-3.2.1-3.2 1.8v10.8c0 1.7 1.8 2.7 3.2 1.8l8.2-5.4c1.2-.8 1.2-2.6 0-3.4L8 8.8Z'/%3E%3C/g%3E%3C/svg%3E");
      -webkit-mask-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 32 32' xmlns='http://www.w3.org/2000/svg'%3E%3Cg fill='black'%3E%3Crect x='22' y='8' width='4' height='16' rx='2'/%3E%3Cpath d='M8 8.8c-1.4-.9-3.2.1-3.2 1.8v10.8c0 1.7 1.8 2.7 3.2 1.8l8.2-5.4c1.2-.8 1.2-2.6 0-3.4L8 8.8Z'/%3E%3C/g%3E%3C/svg%3E");
    }

    .player-icon.shuffle,
    .player-icon.loop {
      color: rgba(184, 69, 112, .78);
      background-color: currentColor;
      mask-position: center;
      mask-repeat: no-repeat;
      mask-size: 30px 30px;
      -webkit-mask-position: center;
      -webkit-mask-repeat: no-repeat;
      -webkit-mask-size: 30px 30px;
    }

    .player-icon.shuffle {
      mask-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 32 32' xmlns='http://www.w3.org/2000/svg'%3E%3Cg fill='none' stroke='black' stroke-width='2.8' stroke-linecap='round' stroke-linejoin='round'%3E%3Cpath d='M4 9h4.8c4.5 0 6.1 14 11.2 14h4.5'/%3E%3Cpath d='M4 23h4.8c4.5 0 6.1-14 11.2-14h4.5'/%3E%3Cpath d='M22 5l5 4-5 4'/%3E%3Cpath d='M22 19l5 4-5 4'/%3E%3C/g%3E%3C/svg%3E");
      -webkit-mask-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 32 32' xmlns='http://www.w3.org/2000/svg'%3E%3Cg fill='none' stroke='black' stroke-width='2.8' stroke-linecap='round' stroke-linejoin='round'%3E%3Cpath d='M4 9h4.8c4.5 0 6.1 14 11.2 14h4.5'/%3E%3Cpath d='M4 23h4.8c4.5 0 6.1-14 11.2-14h4.5'/%3E%3Cpath d='M22 5l5 4-5 4'/%3E%3Cpath d='M22 19l5 4-5 4'/%3E%3C/g%3E%3C/svg%3E");
    }

    .player-icon.loop {
      mask-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 32 32' xmlns='http://www.w3.org/2000/svg'%3E%3Cg fill='none' stroke='black' stroke-width='2.8' stroke-linecap='round' stroke-linejoin='round'%3E%3Cpath d='M8 11c2.2-3.2 5.8-5 9.8-4.4 3 .5 5.5 2.3 7 4.8'/%3E%3Cpath d='M24.8 6.2v5.2h-5.2'/%3E%3Cpath d='M24 21c-2.2 3.2-5.8 5-9.8 4.4-3-.5-5.5-2.3-7-4.8'/%3E%3Cpath d='M7.2 25.8v-5.2h5.2'/%3E%3C/g%3E%3C/svg%3E");
      -webkit-mask-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 32 32' xmlns='http://www.w3.org/2000/svg'%3E%3Cg fill='none' stroke='black' stroke-width='2.8' stroke-linecap='round' stroke-linejoin='round'%3E%3Cpath d='M8 11c2.2-3.2 5.8-5 9.8-4.4 3 .5 5.5 2.3 7 4.8'/%3E%3Cpath d='M24.8 6.2v5.2h-5.2'/%3E%3Cpath d='M24 21c-2.2 3.2-5.8 5-9.8 4.4-3-.5-5.5-2.3-7-4.8'/%3E%3Cpath d='M7.2 25.8v-5.2h5.2'/%3E%3C/g%3E%3C/svg%3E");
    }

    .player-play {
      position: relative;
      width: 64px;
      height: 64px;
      border: 0;
      border-radius: 999px;
      display: grid;
      place-items: center;
      background: linear-gradient(135deg, #d95f8c, #8f659f);
      box-shadow: 0 10px 22px rgba(184, 69, 112, 0.24);
      cursor: pointer;
    }

    .player-play::before {
      content: "";
      width: 30px;
      height: 30px;
      margin-left: -3px;
      background: #fff;
      mask: url("data:image/svg+xml,%3Csvg viewBox='0 0 32 32' xmlns='http://www.w3.org/2000/svg'%3E%3Cpath fill='black' d='M10 7.8c0-2.1 2.4-3.3 4.1-2.1l13 8.2c1.6 1 1.6 3.3 0 4.3l-13 8.2c-1.7 1.1-4.1-.1-4.1-2.1V7.8Z'/%3E%3C/svg%3E") center / contain no-repeat;
      -webkit-mask: url("data:image/svg+xml,%3Csvg viewBox='0 0 32 32' xmlns='http://www.w3.org/2000/svg'%3E%3Cpath fill='black' d='M10 7.8c0-2.1 2.4-3.3 4.1-2.1l13 8.2c1.6 1 1.6 3.3 0 4.3l-13 8.2c-1.7 1.1-4.1-.1-4.1-2.1V7.8Z'/%3E%3C/svg%3E") center / contain no-repeat;
    }

    .player-play.is-playing::before {
      margin-left: 0;
      mask-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 32 32' xmlns='http://www.w3.org/2000/svg'%3E%3Cg fill='black'%3E%3Crect x='8' y='6' width='6.8' height='20' rx='3.2'/%3E%3Crect x='17.2' y='6' width='6.8' height='20' rx='3.2'/%3E%3C/g%3E%3C/svg%3E");
      -webkit-mask-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 32 32' xmlns='http://www.w3.org/2000/svg'%3E%3Cg fill='black'%3E%3Crect x='8' y='6' width='6.8' height='20' rx='3.2'/%3E%3Crect x='17.2' y='6' width='6.8' height='20' rx='3.2'/%3E%3C/g%3E%3C/svg%3E");
    }

    .mobile-focus-back {
      position: fixed;
      right: 16px;
      bottom: 18px;
      z-index: 30;
      min-height: 44px;
      border: 0;
      border-radius: 999px;
      padding: 0 18px;
      color: #fff;
      background: linear-gradient(135deg, #d95f8c, #b84570);
      box-shadow: 0 10px 24px rgba(184, 69, 112, 0.24);
      cursor: pointer;
    }

    .image-edit-modal {
      position: fixed;
      inset: 0;
      z-index: 70;
      display: grid;
      place-items: center;
      padding: 18px;
      background: rgba(74, 45, 61, 0.32);
      backdrop-filter: blur(8px);
    }

    .image-edit-modal[hidden] { display: none; }

    .image-edit-sheet {
      width: min(100%, 980px);
      max-height: 92vh;
      display: grid;
      gap: 12px;
      padding: 16px;
      border: 2px solid rgba(242, 183, 201, 0.62);
      border-radius: 24px;
      background: rgba(255, 248, 246, 0.98);
      box-shadow: var(--shadow);
      overflow: auto;
    }

    .image-edit-title {
      margin: 0;
      color: var(--rose-deep);
      font-size: 24px;
      font-weight: 900;
      text-align: center;
    }

    .image-edit-toolbar {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      flex-wrap: wrap;
    }

    .image-tool-button {
      min-height: 34px;
      border: 1px solid rgba(217, 95, 140, 0.28);
      border-radius: 999px;
      padding: 0 12px;
      color: var(--rose-deep);
      background: rgba(255, 255, 255, 0.8);
      font-weight: 900;
      cursor: pointer;
    }

    .image-tool-button.active,
    .image-tool-button.primary {
      color: #fff;
      border-color: transparent;
      background: linear-gradient(135deg, #d95f8c, #b84570);
    }

    .brush-control {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      color: var(--muted);
      font-size: 14px;
      font-weight: 800;
    }

    .brush-control input { width: 128px; accent-color: var(--rose); }

    .image-edit-workspace {
      display: grid;
      grid-template-columns: minmax(0, 1fr) 220px;
      gap: 10px;
      align-items: stretch;
    }

    .image-edit-canvas-wrap {
      width: 100%;
      display: grid;
      place-items: center;
      padding: 10px;
      border-radius: 18px;
      background: rgba(255, 255, 255, 0.56);
      overflow: auto;
    }

    .sticker-panel {
      display: grid;
      align-content: start;
      gap: 10px;
      min-height: 100%;
      padding: 10px;
      border: 2px solid rgba(242, 183, 201, 0.52);
      border-radius: 18px;
      background: rgba(255, 255, 255, 0.56);
    }

    .sticker-panel-title {
      color: var(--rose-deep);
      font-size: 16px;
      font-weight: 900;
      text-align: center;
    }

    .sticker-upload-label {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 34px;
      border: 1px solid rgba(217, 95, 140, 0.3);
      border-radius: 999px;
      color: var(--rose-deep);
      background: rgba(255, 255, 255, 0.82);
      font-size: 14px;
      font-weight: 900;
      cursor: pointer;
    }

    .sticker-list {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 8px;
    }

    .sticker-option {
      min-height: 58px;
      border: 1px solid rgba(217, 95, 140, 0.28);
      border-radius: 14px;
      color: var(--rose-deep);
      background: rgba(255, 247, 250, 0.9);
      font-size: 24px;
      font-weight: 900;
      cursor: pointer;
      box-shadow: 0 7px 14px rgba(184, 69, 112, 0.08);
    }

    .sticker-option img {
      max-width: 80%;
      max-height: 46px;
      object-fit: contain;
      pointer-events: none;
    }

    #imageEditCanvas {
      max-width: 100%;
      max-height: 62vh;
      border-radius: 12px;
      box-shadow: 0 10px 24px rgba(128, 76, 95, 0.14);
      cursor: crosshair;
      touch-action: none;
    }

    .export-modal {
      position: fixed;
      inset: 0;
      z-index: 50;
      display: grid;
      place-items: center;
      padding: 18px;
      background: rgba(75, 46, 62, 0.42);
      backdrop-filter: blur(8px);
    }

    .export-modal[hidden] { display: none; }

    .export-sheet {
      position: relative;
      width: min(100%, 520px);
      max-height: min(88vh, 760px);
      display: grid;
      gap: 12px;
      padding: 14px;
      border-radius: 22px;
      background: rgba(255, 248, 246, 0.96);
      box-shadow: 0 20px 55px rgba(75, 46, 62, 0.28);
    }

    .export-preview-image {
      width: 100%;
      max-height: 68vh;
      object-fit: contain;
      border-radius: 14px;
      background: #fff;
    }

    .export-actions {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      flex-wrap: wrap;
    }

    .export-hint {
      margin: 0;
      color: var(--muted);
      font-size: 14px;
      text-align: center;
    }

    .review-edit-modal {
      position: fixed;
      inset: 0;
      z-index: 60;
      display: grid;
      place-items: center;
      padding: 18px;
      background: rgba(74, 45, 61, 0.24);
      backdrop-filter: blur(8px);
    }

    .review-edit-modal[hidden] { display: none; }

    .review-edit-sheet {
      width: min(100%, 720px);
      display: grid;
      gap: 12px;
      padding: 18px;
      border-radius: 22px;
      background: rgba(255, 248, 246, 0.98);
      box-shadow: 0 20px 55px rgba(75, 46, 62, 0.28);
    }

    .review-edit-title {
      margin: 0;
      color: var(--rose-deep);
      font-size: 24px;
      font-weight: 900;
      text-align: center;
    }

    .review-edit-area {
      width: 100%;
      min-height: min(58vh, 520px);
      resize: vertical;
      border: 2px solid rgba(242, 183, 201, 0.62);
      border-radius: 18px;
      padding: 14px 16px;
      color: var(--ink);
      background: rgba(255, 255, 255, 0.82);
      font-size: 22px;
      font-weight: 800;
      line-height: 1.5;
      outline: none;
    }

    .review-edit-actions {
      display: flex;
      justify-content: center;
      gap: 10px;
      flex-wrap: wrap;
    }

    .hidden { display: none !important; }

    @media (max-width: 780px) {
      .image-edit-workspace { grid-template-columns: 1fr; }
      .sticker-panel { max-height: 160px; overflow: auto; }
      .sticker-list { grid-template-columns: repeat(4, minmax(0, 1fr)); }
      .app {
        min-height: 100dvh;
        padding: 10px 8px 14px;
        gap: 10px;
        overflow: hidden;
      }
      .toolbar {
        width: 100%;
        display: grid;
        justify-items: center;
        justify-content: center;
        gap: 8px;
      }
      .template-switch { margin-right: 0; }
      .toolbar-actions {
        justify-content: center;
        flex-wrap: wrap;
      }
      .action-button { min-height: 38px; padding: 0 14px; }
      .stage {
        width: 100%;
        overflow: hidden;
        padding: 0;
        border-radius: 18px;
      }
      .stage.is-focused {
        overflow: auto;
        -webkit-overflow-scrolling: touch;
        touch-action: pan-x pan-y;
      }
      .card { transition: transform 180ms ease; }
      .cover-tools { opacity: 1; pointer-events: auto; }
      .tiny-button { min-height: 34px; font-size: 13px; padding: 4px 9px; }
      .card .tags { gap: 6px; }
      .card .tag { padding: 6px 11px; }
      .card .tag-remove {
        top: -7px;
        right: -7px;
        width: 16px;
        height: 16px;
        font-size: 10px;
        line-height: 16px;
        opacity: 1;
        pointer-events: auto;
      }
      .card .add-tag {
        width: 34px;
        height: 34px;
        font-size: 22px;
        opacity: 1;
        pointer-events: auto;
      }
      .card .metric {
        padding-top: 12px;
      }
      .card .metric-label {
        transform: translateY(5px);
      }
      .card .metric .soft-input {
        transform: translateX(-8px);
      }
      .card .metric-entry {
        transform: translateX(0);
      }
      .card .metric-entry input {
        flex-basis: 60px;
        max-width: 60px;
      }
      .card .metric-suffix {
        font-size: 20px;
      }
      .star,
      .choice-button,
      .add-tag { position: relative; }
      .star::before,
      .choice-button::before,
      .add-tag::before {
        content: "";
        position: absolute;
        inset: -5px;
      }
      .star::before,
      .choice-button::before {
        inset: -8px;
      }
    }
  </style>
</head>
<body>
  <main class="app">
    <h1 class="site-title">乙抓repo模板</h1>
    <div class="toolbar">
      <div class="template-switch" aria-label="template">
        <button class="template-button active" data-template="full" type="button">&#23436;&#25972;&#29256;</button>
        <button class="template-button" data-template="compact" type="button">&#31616;&#30053;&#29256;</button>
      </div>
      <div class="toolbar-actions">
        <button class="action-button" id="resetButton" type="button">&#28165;&#31354;&#20869;&#23481;</button>
        <button class="action-button" id="importDataButton" type="button">&#23548;&#20837;&#25968;&#25454;</button>
        <button class="action-button" id="exportDataButton" type="button">&#23548;&#20986;&#25968;&#25454;</button>
        <button class="action-button primary" id="downloadButton" type="button">&#23548;&#20986;&#22270;&#29255;</button>
        <input class="hidden" id="importDataInput" type="file" accept="application/json,.json" />
      </div>
    </div>

    <button class="mobile-focus-back hidden" id="mobileFocusBack" type="button"></button>

    <div class="stage" id="stage">
      <section class="card" id="recordCard" aria-label="乙抓记录卡画布">

        <label class="cover-box" id="coverBox" aria-label="上传 BK 图片">
          <input class="hidden" id="coverInput" type="file" accept="image/*" />
          <img id="coverImage" alt="" />
          <span class="cover-placeholder">&#28857;&#20987;&#19978;&#20256; BK<br /><span class="full-size">420 &times; 315</span><span class="compact-size">560 &times; 420</span></span>
        </label>
        <div class="cover-tools">
          <button class="tiny-button" id="containButton" type="button">完整显示</button>
          <button class="tiny-button" id="coverButton" type="button">铺满裁切</button>
          <button class="tiny-button" id="imageEditButton" type="button">&#32534;&#36753;&#22270;&#29255;</button>
        </div>

        <aside class="info-panel">
          <div class="panel-title">基本信息</div>
          <div class="field">
            <label>CV</label>
            <div class="editable" id="cvText" contenteditable="true" aria-label="CV"></div>
          </div>
          <div class="field">
            <label>社团</label>
            <div class="editable" id="circleText" contenteditable="true" aria-label="社团"></div>
          </div>
          <div class="field">
            <div class="field-label-row">
              <label>RJ号</label>
              <button class="import-button" id="importButton" type="button"></button>
            </div>
            <div class="editable" id="rjText" contenteditable="true" aria-label="RJ号"></div>
          </div>
          <div class="field">
            <label>时长</label>
            <div class="editable" id="durationText" contenteditable="true" aria-label="时长"></div>
          </div>
          <div class="field cn-field">
            <label>中文</label>
            <div class="choice-group" id="cnChoices" aria-label="中文">
              <button class="choice-button active" type="button">字幕</button>
              <button class="choice-button" type="button">台本</button>
              <button class="choice-button" type="button">无中文</button>
            </div>
          </div>
        </aside>

        <section class="title-panel" aria-label="标题">
          <div class="section-label title-label">标题</div>
          <div class="editable record-title" id="recordTitle" contenteditable="true" data-placeholder="标题" aria-label="标题"></div>
        </section>

        <section class="price-panel" aria-label="价格">
          <div class="section-label price-label">价格</div>
          <div class="metric">
            <div class="metric-label">原价</div>
            <input class="soft-input numeric-input" id="originalPrice" type="text" inputmode="numeric" pattern="[0-9]*" />
          </div>
          <div class="metric">
            <div class="metric-label">现价</div>
            <input class="soft-input numeric-input" id="currentPrice" type="text" inputmode="numeric" pattern="[0-9]*" />
          </div>
          <div class="metric">
            <div class="metric-label">现折扣</div>
            <div class="metric-entry"><input class="soft-input numeric-input" id="currentDiscount" type="text" inputmode="numeric" pattern="[0-9]*" maxlength="3" /><span class="metric-suffix">%off</span></div>
          </div>
          <div class="metric">
            <div class="metric-label">史低</div>
            <div class="metric-entry"><input class="soft-input numeric-input" id="lowestPrice" type="text" inputmode="numeric" pattern="[0-9]*" maxlength="3" /><span class="metric-suffix">%off</span></div>
          </div>
        </section>

    function currentTemplate() {
      return card.classList.contains("compact") ? "compact" : "full";
    }

    function templateSize() {
      return currentTemplate() === "compact" ? { width: 600, height: 800 } : { width: 1080, height: 1440 };
    }

    function isMobileView() {
      return window.matchMedia("(max-width: 780px), (pointer: coarse)").matches || navigator.maxTouchPoints > 0;
    }

    function mobileViewportHeight() {
      return window.visualViewport?.height || window.innerHeight || document.documentElement.clientHeight || 640;
    }

    function focusRectFor(element) {
      const toolPad = element === coverBox ? 64 : 0;
      return {
        left: element.offsetLeft,
        top: element.offsetTop,
        width: element.offsetWidth,
        height: element.offsetHeight + toolPad
      };
    }

    function minimumFocusScale(element, fullScale) {
      if (element.classList.contains("title-panel")) return Math.max(fullScale * 1.75, 0.68);
      if (element.classList.contains("review-panel")) return Math.max(fullScale * 1.65, 0.62);
      if (element.classList.contains("tags-panel")) return Math.max(fullScale * 1.9, 0.78);
      return fullScale;
    }

    function fitStage() {
      const stage = document.getElementById("stage");
      const size = templateSize();
      const toolbarHeight = document.querySelector(".toolbar")?.offsetHeight || 0;
      const availableWidth = Math.max(1, stage.clientWidth - 16);
      const availableHeight = isMobileView()
        ? Math.max(360, mobileViewportHeight() - toolbarHeight - 38)
        : Number.POSITIVE_INFINITY;
      const fullScale = Math.min(1, availableWidth / size.width, availableHeight / size.height);

      stage.classList.toggle("is-focused", isMobileView() && Boolean(mobileFocusTarget) && currentTemplate() === "full");

      if (isMobileView() && mobileFocusTarget && currentTemplate() === "full") {
        const rect = focusRectFor(mobileFocusTarget);
        const isTagsFocus = mobileFocusTarget.classList.contains("tags-panel");
        const focusScale = isTagsFocus
          ? Math.min(1, availableWidth / (rect.width + 24), availableHeight / (rect.height + 42))
          : Math.min(1, availableWidth / (rect.width + 96), availableHeight / (rect.height + 110));
        const scale = Math.min(1, Math.max(fullScale, focusScale, minimumFocusScale(mobileFocusTarget, fullScale)));
        const preferLeft = mobileFocusTarget.classList.contains("title-panel") || mobileFocusTarget.classList.contains("tags-panel") || mobileFocusTarget.classList.contains("review-panel");
        const horizontalPad = preferLeft ? 18 : (availableWidth - rect.width * scale) / 2;
        const tx = Math.round(horizontalPad - rect.left * scale);
        const ty = Math.round((availableHeight - rect.height * scale) / 2 - rect.top * scale);
        card.style.transform = "translate(" + tx + "px, " + ty + "px) scale(" + scale + ")";
        stage.style.height = availableHeight + "px";
        mobileFocusBack.classList.remove("hidden");
        return;
      }

      stage.classList.remove("is-focused");
      const centerX = Math.max(0, (availableWidth - size.width * fullScale) / 2);
      card.style.transform = "translateX(" + Math.round(centerX) + "px) scale(" + fullScale + ")";
      stage.style.height = (size.height * fullScale + (isMobileView() ? 0 : 16)) + "px";
      stage.scrollLeft = 0;
      stage.scrollTop = 0;
      mobileFocusBack.classList.add("hidden");
    }

    function clearMobileFocus() {
      mobileFocusTarget = null;
      fitStage();
    }

    function focusMobileArea(area) {
      if (!isMobileView() || currentTemplate() !== "full") return;
      mobileFocusTarget = area;
      fitStage();
    }

    function openReviewEditor() {
      if (!isMobileView()) return;

      card.classList.toggle("compact", template === "compact");
      templateButtons.forEach((button) => button.classList.toggle("active", button.dataset.template === template));
      fitStage();

    function revokeLastExportUrl() {
      if (lastExportUrl) URL.revokeObjectURL(lastExportUrl);
      lastExportUrl = "";
    }

    function canvasToBlob(canvas) {
      return new Promise((resolve, reject) => {
        canvas.toBlob((blob) => {
          if (blob) resolve(blob);
          else reject(new Error("PNG export failed"));
        }, "image/png");
      });
    }

    function showExportPreview(blob) {
      revokeLastExportUrl();
      lastExportUrl = URL.createObjectURL(blob);
      exportPreviewImage.src = lastExportUrl;
      exportModal.hidden = false;
    }

    function handleExportBlob(blob) {
      if (isMobileView()) {
        showExportPreview(blob);
      } else {
        downloadBlob(blob);
      }
    }

    function sanitizeNumericInput(input) {
      let clean = input.value.replace(/\D+/g, "");
      if (input === currentDiscount || input === lowestPrice) {
        clean = clean.slice(0, 3);
        if (Number(clean) > 100) clean = "100";
      }
      if (input.value !== clean) input.value = clean;
    }

    function calculateDiscountPercent(original, current) {
      const originalText = String(original || "").replace(/\D+/g, "");
      const currentText = String(current || "").replace(/\D+/g, "");
      const originalNumber = Number(originalText);
      const currentNumber = Number(currentText);
      if (!originalNumber || currentText === "" || currentNumber > originalNumber) return "";
      const percent = Math.round((1 - currentNumber / originalNumber) * 100);
      return String(Math.min(100, Math.max(0, percent)));
    }

    function calculateCurrentPriceFromDiscount(original, discount) {
      const originalText = String(original || "").replace(/\D+/g, "");
      const discountText = String(discount || "").replace(/\D+/g, "");
      const originalNumber = Number(originalText);
      const discountNumber = Number(discountText);
      if (!originalNumber || discountText === "" || discountNumber > 100) return "";
      const next = Math.round(originalNumber * (1 - discountNumber / 100));
      return String(Math.min(originalNumber, Math.max(0, next)));
    }

    function updateDiscount(force = false) {
      if (currentDiscountManual && !force) return;
      const next = calculateDiscountPercent(originalPrice.value, currentPrice.value);
      if (currentDiscount.value !== next) currentDiscount.value = next;
    }

    function updateCurrentPriceFromDiscount() {
      const next = calculateCurrentPriceFromDiscount(originalPrice.value, currentDiscount.value);
      if (next !== "" && currentPrice.value !== next) currentPrice.value = next;
    }

    function clamp(value, min, max) {
      return Math.min(max, Math.max(min, value));
    }

    function parsePlayerTime(text) {
      const clean = String(text || "").trim().replace(/^[-\u2013\u2014]+/, "");
      if (!clean) return null;
      const parts = clean.split(":").map((part) => part.trim()).filter(Boolean);
      if (!parts.length || parts.length > 3) return null;
      if (parts.some((part) => !/^\d+$/.test(part))) return null;
      const nums = parts.map(Number);
      if (nums.some((num) => !Number.isFinite(num))) return null;
      if (nums.length === 1) return nums[0] * 60;
      if (nums.length === 2) return nums[0] * 60 + nums[1];
      return nums[0] * 3600 + nums[1] * 60 + nums[2];
    }

    function formatPlayerTime(totalSeconds) {
      const seconds = Math.max(0, Math.round(totalSeconds || 0));
      const minutes = Math.floor(seconds / 60);
      const remain = seconds % 60;
      return String(minutes).padStart(2, "0") + ":" + String(remain).padStart(2, "0");
    }

    function currentPlayerSeconds() {
      return Math.round(playerTotalSeconds * playerProgress);
    }

    function syncPlayerUi(syncText = true) {
      playerTotalSeconds = Math.max(1, Math.round(playerTotalSeconds || PLAYER_DEFAULT_TOTAL));
      playerProgress = clamp(Number(playerProgress) || 0, 0, 1);
      const elapsed = currentPlayerSeconds();
      const remaining = Math.max(0, playerTotalSeconds - elapsed);
      playerBarFill.style.width = (playerProgress * 100).toFixed(2) + "%";
      playerDot.style.left = Math.round((PLAYER_BAR_WIDTH - PLAYER_DOT_SIZE) * playerProgress) + "px";
      playerPlay.classList.toggle("is-playing", playerPlaying);
      playerPlay.setAttribute("aria-label", playerPlaying ? "pause" : "play");
      if (syncText) {
        playerElapsed.textContent = formatPlayerTime(elapsed);
        playerRemaining.textContent = playerProgress === 0 ? formatPlayerTime(playerTotalSeconds) : "-" + formatPlayerTime(remaining);
      }
    }

    function setPlayerProgressFromClientX(clientX) {
      const rect = playerBar.getBoundingClientRect();
      playerProgress = clamp((clientX - rect.left) / rect.width, 0, 1);
      syncPlayerUi(true);
      saveState();
    }

    function commitPlayerTimeEdit(target) {
      const parsed = parsePlayerTime(target.textContent);
      const elapsed = currentPlayerSeconds();
      if (parsed == null) {
        syncPlayerUi(true);
        return;
      }
      if (target === playerElapsed) {
        playerTotalSeconds = Math.max(playerTotalSeconds, parsed, 1);
        playerProgress = clamp(parsed / playerTotalSeconds, 0, 1);
      } else {
        const raw = String(target.textContent || "").trim();
        if (/^[-\u2013\u2014]/.test(raw)) {
          playerTotalSeconds = Math.max(1, elapsed + parsed);
          playerProgress = clamp(elapsed / playerTotalSeconds, 0, 1);
        } else {
          playerTotalSeconds = Math.max(1, parsed);
          playerProgress = clamp(elapsed / playerTotalSeconds, 0, 1);
        }
      }
      syncPlayerUi(true);
      saveState();
    }

    function normalizeWorkno(value) {
      const clean = String(value || "").trim().toUpperCase().replace(/[^A-Z0-9]/g, "");
      const match = clean.match(/(?:RJ)?\d+/);
      if (!match) return "";
      return match[0].startsWith("RJ") ? match[0] : "RJ" + match[0];
    }

    function firstText(...values) {
      for (const value of values) {
        if (Array.isArray(value)) {
          const text = value.map((item) => firstText(item?.name, item?.work_name, item?.title, item)).filter(Boolean).join(" / ");
          if (text) return text;
        } else if (value && typeof value === "object") {
          const text = firstText(value.name, value.work_name, value.title, value.value);
          if (text) return text;
        } else if (value != null && String(value).trim()) {
          return String(value).trim();
        }
      }
      return "";
    }

    function creatorText(creators, key) {
      return firstText(creators?.[key], creators?.[key + "s"]);
    }

    function collectVoiceText(value) {
      if (!value) return "";
      if (Array.isArray(value)) {
        return value.map((item) => collectVoiceText(item)).filter(Boolean).join(" / ");
      }
      if (typeof value === "object") {
        return firstText(value.name, value.work_name, value.title, value.value, value.name_ja, value.name_en);
      }
      return String(value).trim();
    }

    function findVoiceText(source, depth = 0) {
      if (!source || depth > 4) return "";
      if (Array.isArray(source)) {
        for (const item of source) {
          const roleText = firstText(item?.type, item?.role, item?.author_type, item?.creator_type, item?.type_name);
          if (/voice|cv|seiyu|cast/i.test(roleText)) {
            const text = collectVoiceText(item?.name || item?.names || item?.creators || item?.value || item);
            if (text) return text;
          }
        }
        for (const item of source) {
          const text = findVoiceText(item, depth + 1);
          if (text) return text;
        }
        return "";
      }
      if (typeof source === "object") {
        for (const key of ["voice_by", "voice_bys", "voice", "voices", "cv", "cvs", "cast", "casts"]) {
          const text = collectVoiceText(source[key]);
          if (text) return text;
        }
        for (const [key, value] of Object.entries(source)) {
          if (/voice|cv|seiyu|cast/i.test(key)) {
            const text = collectVoiceText(value);
            if (text) return text;
          }
        }
        for (const value of Object.values(source)) {
          const text = findVoiceText(value, depth + 1);
          if (text) return text;
        }
      }
      return "";
    }

    function numericText(value) {
      const text = firstText(value).replace(/[^0-9]/g, "");
      return text;
    }

    function parseDlsiteProduct(raw) {
      let product = Array.isArray(raw) ? raw[0] : raw;
      if (product && typeof product === "object" && !product.work_name && !product.title) {
        const firstKey = Object.keys(product)[0];
        if (firstKey && product[firstKey] && typeof product[firstKey] === "object") product = product[firstKey];
      }
      if (!product || typeof product !== "object") return null;
      const creators = product.creators || product.creaters || product.maker || {};
      return {
        title: firstText(product.work_name, product.title, product.name, product.work?.work_name),
        cv: firstText(findVoiceText(creators), findVoiceText(product), creatorText(creators, "voice_by"), product.voice_by, product.voice),
        circle: firstText(product.maker_name, product.circle, product.maker?.name, product.brand?.name),
        originalPrice: numericText(product.official_price, product.price, product.price_str, product.work_price)
      };
    }

    function dlsiteProxyUrl() {
      const param = new URLSearchParams(window.location.search).get("dlsiteProxy");
      return (param || DLSITE_PROXY_URL).trim();
    }

    function buildProxyUrl(base, workno) {
      if (!base) return "";
      if (base.includes("{workno}")) return base.replace("{workno}", encodeURIComponent(workno));
      const url = new URL(base, window.location.href);
      url.searchParams.set("workno", workno);
      return url.toString();
    }

    async function fetchProductJson(workno) {
      const directUrl = "https://www.dlsite.com/maniax/api/=/product.json?workno=" + encodeURIComponent(workno);
      const attempts = [directUrl];
      const proxyUrl = buildProxyUrl(dlsiteProxyUrl(), workno);
      if (proxyUrl) attempts.push(proxyUrl);
      let lastError;
      for (const url of attempts) {
        try {
          const response = await fetch(url, { mode: "cors", credentials: "omit" });
          if (!response.ok) throw new Error("HTTP " + response.status);
          return await response.json();
        } catch (error) {
          lastError = error;
          console.warn("DLsite import attempt failed", url, error);
        }
      }
      throw lastError || new Error("DLsite import failed");
    }

    function applyImportedProduct(product) {
      if (product.title) setEditableText("recordTitle", product.title);
      if (product.cv) setEditableText("cvText", product.cv);
      if (product.circle) setEditableText("circleText", product.circle);
      if (product.originalPrice) originalPrice.value = product.originalPrice;
      updateDiscount();
      saveState();
    }

    async function importProductInfo() {
      const workno = normalizeWorkno(editableText("rjText"));
      if (!workno) {
        alert(UI_IMPORT_NEED_RJ);
        return;
      }
      importButton.disabled = true;
      importButton.textContent = UI_IMPORT_LOADING;
      try {
        const product = parseDlsiteProduct(await fetchProductJson(workno));
        if (!product || (!product.title && !product.cv && !product.circle && !product.originalPrice)) {
          throw new Error("empty product");
        }
        applyImportedProduct(product);
        importButton.textContent = UI_IMPORT_DONE;
        window.setTimeout(() => { importButton.textContent = UI_IMPORT_INFO; }, 1200);
      } catch (error) {
        console.warn("import failed", error);
        alert(UI_IMPORT_FAILED);
        importButton.textContent = UI_IMPORT_INFO;
      } finally {
        importButton.disabled = false;
      }
    }

    function makeStars(row, value = 4) {
      const wrap = row.querySelector(".stars");
      for (let index = 1; index <= 5; index += 1) {
        const star = document.createElement("button");
        star.className = `star${index <= value ? " active" : ""}`;
        star.type = "button";
        star.textContent = "★";
        star.setAttribute("aria-label", `${index} 星`);
        star.addEventListener("click", () => {
          wrap.querySelectorAll(".star").forEach((item, itemIndex) => {
            item.classList.toggle("active", itemIndex < index);
          });
        });
        wrap.appendChild(star);
      }
    }

    document.querySelectorAll(".rating-row").forEach((row) => makeStars(row));
    function insertPlainText(text) {
      const selection = window.getSelection();
      if (!selection || !selection.rangeCount) return;
      selection.deleteFromDocument();
      selection.getRangeAt(0).insertNode(document.createTextNode(text));
      selection.collapseToEnd();
    }


    function normalizeEditableNode(node) {
      if (!node || (!node.isContentEditable && !node.classList?.contains("tag"))) return;
      if (!node.querySelector?.("a, span, font, b, strong, i, em, u")) return;
      const selection = window.getSelection();
      const text = node.textContent;
      node.textContent = text;
      const range = document.createRange();
      range.selectNodeContents(node);
      range.collapse(false);
      selection.removeAllRanges();
      selection.addRange(range);
    }

    document.addEventListener("input", (event) => {
      const target = event.target;
      if (target instanceof HTMLElement && target.isContentEditable) {
        normalizeEditableNode(target);
      }
    });

    document.addEventListener("paste", (event) => {
      const target = event.target;
      if (!(target instanceof HTMLElement)) return;
      if (!target.isContentEditable && !target.matches("textarea, input")) return;
      const text = event.clipboardData?.getData("text/plain");
      if (text == null) return;
      event.preventDefault();
      if (target.matches("textarea, input")) {
        const start = target.selectionStart ?? target.value.length;
        const end = target.selectionEnd ?? target.value.length;
        target.value = target.value.slice(0, start) + text + target.value.slice(end);
        target.selectionStart = target.selectionEnd = start + text.length;
        target.dispatchEvent(new Event("input", { bubbles: true }));
      } else {
        insertPlainText(text);
      }
    });



    function loadImage(src) {
      return new Promise((resolve, reject) => {
        const img = new Image();
        img.onload = () => resolve(img);
        img.onerror = reject;
        img.src = src;
      });
    }

    function resizeEditorCanvases(width, height) {
      [imageEditCanvas, editOriginalCanvas, editMosaicCanvas, editBlurCanvas, editMosaicMaskCanvas, editBlurMaskCanvas].forEach((canvas) => {
        canvas.width = width;
        canvas.height = height;
      });
    }

    function clearEditorMasks() {
      editMosaicMaskCtx.clearRect(0, 0, editMosaicMaskCanvas.width, editMosaicMaskCanvas.height);
      editBlurMaskCtx.clearRect(0, 0, editBlurMaskCanvas.width, editBlurMaskCanvas.height);
    }

    function cloneSticker(sticker) {
      return sticker ? { ...sticker } : sticker;
    }

    function cloneStickerList(list) {
      return Array.isArray(list) ? list.map(cloneSticker).filter(Boolean) : [];
    }

    function allStickerSources() {
      return defaultStickerSources.concat(stickerSources || []);
    }

    function stickerById(id) {
      return allStickerSources().find((item) => item.id === id);
    }

    function nextStickerId(prefix = "sticker") {
      return prefix + "-" + Date.now().toString(36) + "-" + Math.random().toString(36).slice(2, 7);
    }

    function clampSticker(sticker) {
      if (!sticker || !imageEditCanvas.width || !imageEditCanvas.height) return;
      const minSize = 36;
      sticker.w = Math.max(minSize, Math.min(sticker.w || 100, imageEditCanvas.width));
      sticker.h = Math.max(minSize, Math.min(sticker.h || 70, imageEditCanvas.height));
      sticker.x = clamp(sticker.x || 0, 0, Math.max(0, imageEditCanvas.width - sticker.w));
      sticker.y = clamp(sticker.y || 0, 0, Math.max(0, imageEditCanvas.height - sticker.h));
    }

    function renderStickerPicker() {
      if (!stickerList) return;
      stickerList.innerHTML = "";
      allStickerSources().forEach((source) => {
        const button = document.createElement("button");
        button.className = "sticker-option";
        button.type = "button";
        button.dataset.stickerId = source.id;
        if (source.type === "image") {
          const img = document.createElement("img");
          img.src = source.src;
          img.alt = "";
          button.appendChild(img);
        } else {
          button.textContent = source.text || "";
        }
        stickerList.appendChild(button);
      });
    }

    function addSticker(sourceId) {
      const source = stickerById(sourceId);
      if (!source || !imageEditCanvas.width || !imageEditCanvas.height) return;
      snapshotEditorMasks();
      const w = Math.min(128, imageEditCanvas.width * 0.28);
      const h = source.type === "image" ? w : Math.round(w * 0.64);
      const sticker = {
        id: nextStickerId(),
        sourceId,
        x: Math.round((imageEditCanvas.width - w) / 2),
        y: Math.round((imageEditCanvas.height - h) / 2),
        w: Math.round(w),
        h: Math.round(h)
      };
      clampSticker(sticker);
      coverStickers.push(sticker);
      selectedStickerId = sticker.id;
      renderImageEditor();
      saveEditorProject();
      saveState();
    }

    function snapshotEditorMasks() {
      editorUndoStack.push({
        mosaic: editMosaicMaskCtx.getImageData(0, 0, editMosaicMaskCanvas.width, editMosaicMaskCanvas.height),
        blur: editBlurMaskCtx.getImageData(0, 0, editBlurMaskCanvas.width, editBlurMaskCanvas.height),
        stickers: cloneStickerList(coverStickers)
      });
      if (editorUndoStack.length > 24) editorUndoStack.shift();
    }

    function restoreEditorSnapshot(snapshot) {
      if (!snapshot) return;
      editMosaicMaskCtx.putImageData(snapshot.mosaic, 0, 0);
      editBlurMaskCtx.putImageData(snapshot.blur, 0, 0);
      coverStickers = cloneStickerList(snapshot.stickers);
      selectedStickerId = null;
      renderImageEditor();
    }

    function maskSnapshotToDataUrls(snapshot) {
      if (!snapshot || !editMosaicMaskCanvas.width || !editMosaicMaskCanvas.height) return null;
      const mosaic = document.createElement("canvas");
      const blur = document.createElement("canvas");
      mosaic.width = blur.width = editMosaicMaskCanvas.width;
      mosaic.height = blur.height = editMosaicMaskCanvas.height;
      mosaic.getContext("2d").putImageData(snapshot.mosaic, 0, 0);
      blur.getContext("2d").putImageData(snapshot.blur, 0, 0);
      return { mosaic: mosaic.toDataURL("image/png"), blur: blur.toDataURL("image/png"), stickers: cloneStickerList(snapshot.stickers) };
    }

    async function dataUrlToImageData(src, width, height) {
      if (!src) return null;
      const img = await loadImage(src).catch(() => null);
      if (!img) return null;
      const canvas = document.createElement("canvas");
      canvas.width = width;
      canvas.height = height;
      const ctx = canvas.getContext("2d");
      ctx.clearRect(0, 0, width, height);
      ctx.drawImage(img, 0, 0, width, height);
      return ctx.getImageData(0, 0, width, height);
    }

    async function restoreMaskCanvasFromSrc(ctx, src, width, height) {
      ctx.clearRect(0, 0, width, height);
      if (!src) return;
      const img = await loadImage(src).catch(() => null);
      if (img) ctx.drawImage(img, 0, 0, width, height);
    }

    async function restoreEditorUndoStack(width, height) {
      const items = Array.isArray(coverEditorUndoStack) ? coverEditorUndoStack.slice(-12) : [];
      const restored = [];
      for (const item of items) {
        const mosaic = await dataUrlToImageData(item?.mosaic, width, height);
        const blur = await dataUrlToImageData(item?.blur, width, height);
        if (mosaic && blur) restored.push({ mosaic, blur, stickers: cloneStickerList(item?.stickers) });
      }
      editorUndoStack = restored;
    }

    function saveEditorProject() {
      if (!imageEditCanvas.width || !imageEditCanvas.height) return;
      coverMosaicMaskSrc = editMosaicMaskCanvas.toDataURL("image/png");
      coverBlurMaskSrc = editBlurMaskCanvas.toDataURL("image/png");
      coverEditorUndoStack = editorUndoStack.map(maskSnapshotToDataUrls).filter(Boolean).slice(-12);
      coverStickers = cloneStickerList(coverStickers);
    }

    function buildEffectCanvases() {
      const width = editOriginalCanvas.width;
      const height = editOriginalCanvas.height;
      editMosaicCtx.clearRect(0, 0, width, height);
      const small = document.createElement("canvas");
      const smallCtx = small.getContext("2d");
      const block = 22;
      small.width = Math.max(1, Math.round(width / block));
      small.height = Math.max(1, Math.round(height / block));
      smallCtx.drawImage(editOriginalCanvas, 0, 0, small.width, small.height);
      editMosaicCtx.imageSmoothingEnabled = false;
      editMosaicCtx.drawImage(small, 0, 0, small.width, small.height, 0, 0, width, height);
      editMosaicCtx.imageSmoothingEnabled = true;

      editBlurCtx.clearRect(0, 0, width, height);
      editBlurCtx.save();
      editBlurCtx.filter = "blur(16px)";
      editBlurCtx.drawImage(editOriginalCanvas, 0, 0);
      editBlurCtx.restore();
    }

    function drawMaskedEffect(targetCtx, effectCanvas, maskCanvas) {
      const temp = document.createElement("canvas");
      temp.width = effectCanvas.width;
      temp.height = effectCanvas.height;
      const tempCtx = temp.getContext("2d");
      tempCtx.drawImage(effectCanvas, 0, 0);
      tempCtx.globalCompositeOperation = "destination-in";
      tempCtx.drawImage(maskCanvas, 0, 0);
      tempCtx.globalCompositeOperation = "source-over";
      targetCtx.drawImage(temp, 0, 0);
    }

    function drawRoundRectPath(ctx, x, y, w, h, r) {
      const radius = Math.min(r, w / 2, h / 2);
      ctx.beginPath();
      ctx.moveTo(x + radius, y);
      ctx.lineTo(x + w - radius, y);
      ctx.quadraticCurveTo(x + w, y, x + w, y + radius);
      ctx.lineTo(x + w, y + h - radius);
      ctx.quadraticCurveTo(x + w, y + h, x + w - radius, y + h);
      ctx.lineTo(x + radius, y + h);
      ctx.quadraticCurveTo(x, y + h, x, y + h - radius);
      ctx.lineTo(x, y + radius);
      ctx.quadraticCurveTo(x, y, x + radius, y);
      ctx.closePath();
    }

    function drawTextSticker(ctx, source, sticker) {
      ctx.save();
      drawRoundRectPath(ctx, sticker.x, sticker.y, sticker.w, sticker.h, Math.min(22, sticker.h / 2));
      ctx.fillStyle = "rgba(255, 247, 250, 0.9)";
      ctx.fill();
      ctx.lineWidth = Math.max(2, sticker.w / 70);
      ctx.strokeStyle = "rgba(217, 95, 140, 0.36)";
      ctx.stroke();
      ctx.fillStyle = "#d95f8c";
      ctx.textAlign = "center";
      ctx.textBaseline = "middle";
      ctx.font = canvasFont("900", Math.max(18, Math.round(sticker.h * 0.52)));
      ctx.fillText(source.text || "", sticker.x + sticker.w / 2, sticker.y + sticker.h / 2 + 1);
      ctx.restore();
    }

    function drawImageSticker(ctx, source, sticker) {
      let img = stickerImageCache.get(source.id);
      if (!img) {
        img = new Image();
        img.onload = () => renderImageEditor();
        img.src = source.src;
        stickerImageCache.set(source.id, img);
      }
      if (img.complete && img.naturalWidth) ctx.drawImage(img, sticker.x, sticker.y, sticker.w, sticker.h);
    }

    function drawStickerControls(ctx, sticker) {
      const handle = Math.max(18, Math.round(Math.min(imageEditCanvas.width, imageEditCanvas.height) * 0.035));
      ctx.save();
      ctx.strokeStyle = "rgba(217, 95, 140, 0.88)";
      ctx.lineWidth = Math.max(2, handle / 8);
      ctx.setLineDash([8, 6]);
      ctx.strokeRect(sticker.x, sticker.y, sticker.w, sticker.h);
      ctx.setLineDash([]);
      const points = [
        [sticker.x, sticker.y],
        [sticker.x + sticker.w, sticker.y],
        [sticker.x, sticker.y + sticker.h],
        [sticker.x + sticker.w, sticker.y + sticker.h]
      ];
      ctx.fillStyle = "#fff";
      ctx.strokeStyle = "rgba(217, 95, 140, 0.8)";
      points.forEach(([x, y]) => {
        ctx.beginPath();
        ctx.arc(x, y, handle / 2, 0, Math.PI * 2);
        ctx.fill();
        ctx.stroke();
      });
      ctx.fillStyle = "#d95f8c";
      ctx.beginPath();
      ctx.arc(sticker.x + sticker.w, sticker.y, handle * 0.58, 0, Math.PI * 2);
      ctx.fill();
      ctx.strokeStyle = "#fff";
      ctx.lineWidth = Math.max(2, handle / 9);
      ctx.beginPath();
      ctx.moveTo(sticker.x + sticker.w - handle * 0.22, sticker.y - handle * 0.22);
      ctx.lineTo(sticker.x + sticker.w + handle * 0.22, sticker.y + handle * 0.22);
      ctx.moveTo(sticker.x + sticker.w + handle * 0.22, sticker.y - handle * 0.22);
      ctx.lineTo(sticker.x + sticker.w - handle * 0.22, sticker.y + handle * 0.22);
      ctx.stroke();
      ctx.restore();
    }

    function drawEditorStickers(ctx, showControls = false) {
      coverStickers.forEach((sticker) => {
        const source = stickerById(sticker.sourceId);
        if (!source) return;
        clampSticker(sticker);
        if (source.type === "image") drawImageSticker(ctx, source, sticker);
        else drawTextSticker(ctx, source, sticker);
      });
      if (showControls && selectedStickerId) {
        const selected = coverStickers.find((item) => item.id === selectedStickerId);
        if (selected) drawStickerControls(ctx, selected);
      }
    }

    function renderImageEditor(targetCanvas = imageEditCanvas, options = {}) {
      if (!editorImage) return;
      const ctx = targetCanvas.getContext("2d");
      ctx.clearRect(0, 0, targetCanvas.width, targetCanvas.height);
      ctx.drawImage(editOriginalCanvas, 0, 0);
      drawMaskedEffect(ctx, editMosaicCanvas, editMosaicMaskCanvas);
      drawMaskedEffect(ctx, editBlurCanvas, editBlurMaskCanvas);
      drawEditorStickers(ctx, options.controls !== false && targetCanvas === imageEditCanvas);
    }

    function editorPointFromEvent(event) {
      const rect = imageEditCanvas.getBoundingClientRect();
      return {
        x: (event.clientX - rect.left) * (imageEditCanvas.width / rect.width),
        y: (event.clientY - rect.top) * (imageEditCanvas.height / rect.height)
      };
    }

    function stickerHandleSize() {
      return Math.max(22, Math.round(Math.min(imageEditCanvas.width, imageEditCanvas.height) * 0.045));
    }

    function pointInCircle(point, x, y, radius) {
      return Math.hypot(point.x - x, point.y - y) <= radius;
    }

    function hitTestSticker(point) {
      const handle = stickerHandleSize();
      for (let i = coverStickers.length - 1; i >= 0; i -= 1) {
        const sticker = coverStickers[i];
        const corners = [
          { corner: "nw", x: sticker.x, y: sticker.y },
          { corner: "ne", x: sticker.x + sticker.w, y: sticker.y },
          { corner: "sw", x: sticker.x, y: sticker.y + sticker.h },
          { corner: "se", x: sticker.x + sticker.w, y: sticker.y + sticker.h }
        ];
        if (pointInCircle(point, sticker.x + sticker.w, sticker.y, handle * 0.7)) return { sticker, action: "delete" };
        const corner = corners.find((item) => pointInCircle(point, item.x, item.y, handle * 0.72));
        if (corner) return { sticker, action: "resize", corner: corner.corner };
        if (point.x >= sticker.x && point.x <= sticker.x + sticker.w && point.y >= sticker.y && point.y <= sticker.y + sticker.h) {
          return { sticker, action: "move" };
        }
      }
      return null;
    }

    function resizeStickerFromCorner(sticker, corner, point, start) {
      const ratio = Math.max(0.1, start.w / Math.max(1, start.h));
      let fixedX = start.x;
      let fixedY = start.y;
      let signX = 1;
      let signY = 1;
      if (corner === "nw") { fixedX = start.x + start.w; fixedY = start.y + start.h; signX = -1; signY = -1; }
      if (corner === "ne") { fixedX = start.x; fixedY = start.y + start.h; signX = 1; signY = -1; }
      if (corner === "sw") { fixedX = start.x + start.w; fixedY = start.y; signX = -1; signY = 1; }
      const rawW = Math.abs(point.x - fixedX);
      const rawH = Math.abs(point.y - fixedY);
      let nextW = Math.max(36, Math.max(rawW, rawH * ratio));
      let nextH = nextW / ratio;
      nextW = Math.min(nextW, imageEditCanvas.width);
      nextH = Math.min(nextH, imageEditCanvas.height);
      let nextX = signX < 0 ? fixedX - nextW : fixedX;
      let nextY = signY < 0 ? fixedY - nextH : fixedY;
      sticker.w = nextW;
      sticker.h = nextH;
      sticker.x = nextX;
      sticker.y = nextY;
      clampSticker(sticker);
    }

    function moveSticker(sticker, point, start) {
      sticker.x = start.x + (point.x - start.pointerX);
      sticker.y = start.y + (point.y - start.pointerY);
      clampSticker(sticker);
    }

    function resizeCursorForCorner(corner) {
      return corner === "nw" || corner === "se" ? "nwse-resize" : "nesw-resize";
    }

    function cursorForEditorHit(hit) {
      if (!hit) return editorTool === "sticker" ? "default" : "crosshair";
      if (hit.action === "delete") return "pointer";
      if (hit.action === "resize") return resizeCursorForCorner(hit.corner);
      return "move";
    }

    function updateEditorCursor(event) {
      if (!editorImage) {
        imageEditCanvas.style.cursor = "default";
        return;
      }
      if (editorStickerDrag) {
        imageEditCanvas.style.cursor = editorStickerDrag.action === "resize" ? resizeCursorForCorner(editorStickerDrag.corner) : "move";
        return;
      }
      if (editorDrawing) {
        imageEditCanvas.style.cursor = editorTool === "erase" ? "cell" : "crosshair";
        return;
      }
      const point = editorPointFromEvent(event);
      imageEditCanvas.style.cursor = cursorForEditorHit(hitTestSticker(point));
    }

    function drawEditorStroke(from, to) {
      const size = Number(brushSize.value) || 42;
      const contexts = editorTool === "erase" ? [editMosaicMaskCtx, editBlurMaskCtx] : [editorTool === "blur" ? editBlurMaskCtx : editMosaicMaskCtx];
      contexts.forEach((ctx) => {
        ctx.save();
        ctx.globalCompositeOperation = editorTool === "erase" ? "destination-out" : "source-over";
        ctx.strokeStyle = "#fff";
        ctx.fillStyle = "#fff";
        ctx.lineWidth = size;
        ctx.lineCap = "round";
        ctx.lineJoin = "round";
        ctx.beginPath();
        ctx.moveTo(from.x, from.y);
        ctx.lineTo(to.x, to.y);
        ctx.stroke();
        ctx.beginPath();
        ctx.arc(to.x, to.y, size / 2, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();
      });
      renderImageEditor();
    }

    function setEditorTool(tool) {
      editorTool = tool;
      imageToolMosaic.classList.toggle("active", tool === "mosaic");
      imageToolBlur.classList.toggle("active", tool === "blur");
      imageToolErase.classList.toggle("active", tool === "erase");
      imageToolSticker.classList.toggle("active", tool === "sticker");
      imageEditCanvas.style.cursor = tool === "sticker" ? "default" : "crosshair";
    }

    async function openImageEditor() {
      const src = coverOriginalSrc || coverImage.getAttribute("src") || coverEditedSrc || "";
      if (!src) {
        coverInput.click();
        return;
      }
      editorSourceSrc = src;
      editorSessionSnapshot = {
        coverOriginalSrc,
        coverEditedSrc,
        coverMosaicMaskSrc,
        coverBlurMaskSrc,
        coverEditorUndoStack: JSON.parse(JSON.stringify(coverEditorUndoStack || [])),
        coverStickers: cloneStickerList(coverStickers),
        stickerSources: JSON.parse(JSON.stringify(stickerSources || [])),
        selectedStickerId,
        editorTool
      };
      editorImage = await loadImage(src);
      const width = editorImage.naturalWidth || editorImage.width;
      const height = editorImage.naturalHeight || editorImage.height;
      resizeEditorCanvases(width, height);
      editOriginalCtx.clearRect(0, 0, width, height);
      editOriginalCtx.drawImage(editorImage, 0, 0, width, height);
      buildEffectCanvases();
      clearEditorMasks();
      await restoreMaskCanvasFromSrc(editMosaicMaskCtx, coverMosaicMaskSrc, width, height);
      await restoreMaskCanvasFromSrc(editBlurMaskCtx, coverBlurMaskSrc, width, height);
      await restoreEditorUndoStack(width, height);
      renderStickerPicker();
      setEditorTool(editorTool || "mosaic");
      renderImageEditor();

    function roundRect(ctx, x, y, w, h, r) {
      const radius = Math.min(r, w / 2, h / 2);
      ctx.beginPath();
      ctx.moveTo(x + radius, y);
      ctx.arcTo(x + w, y, x + w, y + h, radius);
      ctx.arcTo(x + w, y + h, x, y + h, radius);
      ctx.arcTo(x, y + h, x, y, radius);
      ctx.arcTo(x, y, x + w, y, radius);
      ctx.closePath();
    }

    function strokeRound(ctx, x, y, w, h, r, stroke, width = 2, dashed = false) {
      ctx.save();
      roundRect(ctx, x, y, w, h, r);
      ctx.strokeStyle = stroke;
      ctx.lineWidth = width;
      if (dashed) ctx.setLineDash([10, 10]);
      ctx.stroke();
      ctx.restore();
    }

    function fillRound(ctx, x, y, w, h, r, fill) {
      ctx.save();
      roundRect(ctx, x, y, w, h, r);
      ctx.fillStyle = fill;
      ctx.fill();
      ctx.restore();
    }
