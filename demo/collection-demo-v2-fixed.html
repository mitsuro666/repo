<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>乙抓记录｜我的收藏 Demo</title>
<style>
:root{
  --bg-a:#fff1e7;
  --bg-b:#eefaf6;
  --paper:#fffdfb;
  --paper-2:#fff9f7;
  --line:#efd9dc;
  --line-strong:#dda6b6;
  --text:#4e3945;
  --muted:#9b7f8d;
  --pink:#d94f83;
  --pink-deep:#bf3e72;
  --pink-soft:#f9dce6;
  --mint:#b9ddd7;
  --orange:#d99a5e;
  --shadow:0 16px 50px rgba(118,75,90,.10);
  --sidebar:220px;
}
*{box-sizing:border-box}
[hidden]{display:none !important}
html,body{margin:0;min-height:100%;font-family:"PingFang SC","Hiragino Sans GB","Microsoft YaHei",system-ui,sans-serif;color:var(--text)}
body{
  background:
    radial-gradient(circle at 10% 10%, rgba(255,217,199,.6), transparent 28%),
    radial-gradient(circle at 92% 15%, rgba(203,238,229,.7), transparent 30%),
    linear-gradient(120deg,var(--bg-a),#fffaf6 50%,var(--bg-b));
}
button,input,select{font:inherit}
button{cursor:pointer}

.app{min-height:100vh}

/* sidebar */
.sidebar{
  position:fixed; inset:0 auto 0 0;
  width:var(--sidebar);
  padding:26px 20px 18px;
  background:rgba(255,253,250,.86);
  backdrop-filter:blur(18px);
  border-right:1px solid rgba(221,166,182,.42);
  z-index:50;
}
.brand{
  padding:2px 10px 24px;
  border-bottom:1px solid rgba(221,166,182,.22);
  margin-bottom:22px;
}
.brand-main{
  display:flex;align-items:center;gap:9px;
  font-weight:800;font-size:24px;letter-spacing:.03em;color:var(--pink-deep);
}
.brand-mark{
  width:30px;height:30px;display:grid;place-items:center;
  color:var(--pink);font-size:22px;
}
.brand-sub{font-size:10px;letter-spacing:.18em;color:#d57b9c;margin:4px 0 0 39px}

.nav-label{
  font-size:11px;color:#b39aa5;letter-spacing:.12em;
  margin:20px 10px 8px;
}
.nav-item{
  position:relative;
  width:100%;
  height:46px;
  display:flex;align-items:center;gap:12px;
  border:0;background:transparent;color:#5b4652;
  padding:0 12px;
  text-align:left;
  font-weight:650;
}
.nav-item svg{width:19px;height:19px;stroke:currentColor;fill:none;stroke-width:1.8}
.nav-item:hover{background:rgba(217,79,131,.045)}
.nav-item.active{
  color:var(--pink-deep);
  background:linear-gradient(90deg,rgba(217,79,131,.09),rgba(217,79,131,.025));
}
.nav-item.active::before{
  content:"";position:absolute;left:-20px;top:8px;bottom:8px;width:3px;
  border-radius:2px;background:var(--pink);
}

.sidebar-foot{
  position:absolute;left:20px;right:20px;bottom:18px;
  border-top:1px solid rgba(221,166,182,.22);padding-top:14px;
  color:#a98796;font-size:12px;
}

/* main */
.main{
  margin-left:var(--sidebar);
  min-height:100vh;
}
.topbar{
  position:sticky;top:0;z-index:40;
  height:76px;
  display:flex;align-items:center;justify-content:space-between;
  padding:0 38px;
  background:rgba(255,253,251,.85);
  backdrop-filter:blur(16px);
  border-bottom:1px solid rgba(221,166,182,.35);
}
.topbar h1{font-size:22px;margin:0;letter-spacing:.03em}
.top-actions{display:flex;gap:10px;align-items:center}
.text-btn,.primary-btn{
  border:0;background:transparent;padding:10px 14px;color:#6d5360;
}
.primary-btn{
  background:var(--pink);color:#fff;border-radius:10px;
  box-shadow:0 8px 20px rgba(217,79,131,.2);font-weight:700;
}
.primary-btn:hover{background:var(--pink-deep)}

.subbar{
  min-height:62px;
  display:flex;align-items:center;justify-content:space-between;gap:24px;
  padding:0 38px;
  border-bottom:1px solid rgba(221,166,182,.28);
  background:rgba(255,250,248,.72);
}
.tabs{display:flex;gap:28px;height:62px;align-items:stretch}
.tab{
  position:relative;border:0;background:transparent;color:#856c78;font-weight:700;
  padding:0 4px;
}
.tab.active{color:var(--pink-deep)}
.tab.active::after{
  content:"";position:absolute;left:0;right:0;bottom:0;height:3px;background:var(--pink);border-radius:3px 3px 0 0;
}
.sub-meta{font-size:13px;color:#a68b98}

.workspace{padding:28px 38px 70px;max-width:1480px;margin:0 auto}
.control-row{
  display:grid;
  grid-template-columns:minmax(280px,1fr) auto auto;
  gap:12px;align-items:center;
  margin-bottom:18px;
}
.searchbox{
  display:flex;align-items:center;gap:10px;
  border-bottom:1px solid var(--line-strong);
  padding:8px 4px;
}
.searchbox svg{width:18px;height:18px;stroke:#b88195;fill:none;stroke-width:1.8}
.searchbox input{
  border:0;outline:none;background:transparent;width:100%;color:var(--text);
}
.sort-select{
  border:1px solid var(--line);background:rgba(255,255,255,.65);
  border-radius:8px;padding:10px 12px;color:#6c525e;outline:none;
}
.view-toggle{
  display:flex;border-left:1px solid var(--line);padding-left:12px;gap:4px
}
.icon-btn{
  width:38px;height:38px;border:0;background:transparent;display:grid;place-items:center;color:#9b7c8a;
}
.icon-btn.active{color:var(--pink)}
.icon-btn svg{width:19px;height:19px;stroke:currentColor;fill:none;stroke-width:1.8}

.library-layout{
  display:grid;grid-template-columns:190px 1fr;gap:26px;align-items:start;
}
.tag-panel{
  position:sticky;top:156px;
  border-right:1px solid rgba(221,166,182,.45);
  padding-right:20px;
}
.tag-title{
  font-size:12px;letter-spacing:.12em;color:#a88a97;margin-bottom:12px;
}
.tag-link{
  width:100%;display:flex;align-items:center;justify-content:space-between;
  border:0;background:transparent;padding:9px 6px;color:#6c5561;text-align:left;
}
.tag-link:hover,.tag-link.active{color:var(--pink-deep)}
.tag-link.active{font-weight:800}
.tag-count{font-size:11px;color:#b79da8}
.add-tag{margin-top:8px;color:var(--pink);font-size:13px}

/* grid */
.grid{
  display:grid;
  grid-template-columns:repeat(4,minmax(0,1fr));
  gap:26px 20px;
}
.record{
  min-width:0;
  cursor:pointer;
}
.cover{
  position:relative;aspect-ratio:4/3;
  overflow:hidden;
  border:1px solid rgba(221,166,182,.48);
  background:#eee;
  transition:.22s ease;
}
.record:hover .cover{transform:translateY(-3px);box-shadow:0 16px 35px rgba(99,62,76,.14)}
.cover::after{
  content:"";position:absolute;inset:0;
  background:linear-gradient(180deg,transparent 58%,rgba(37,21,29,.56));
  opacity:0;transition:.2s;
}
.record:hover .cover::after{opacity:1}
.cover-title{
  position:absolute;z-index:2;left:14px;right:14px;bottom:12px;
  color:white;font-size:13px;font-weight:700;line-height:1.45;
  opacity:0;transform:translateY(6px);transition:.2s;
}
.record:hover .cover-title{opacity:1;transform:none}
.cover-art{
  position:absolute;inset:0;
  display:flex;align-items:flex-end;padding:18px;
  color:white;
}
.art-1{background:
  radial-gradient(circle at 70% 20%,#ffcedb 0 10%,transparent 35%),
  linear-gradient(135deg,#28324b 0 32%,#75576b 32% 58%,#eaa0b3 58% 100%)}
.art-2{background:
  radial-gradient(circle at 30% 25%,#d4f1ee 0 12%,transparent 30%),
  linear-gradient(150deg,#7aa9ac,#344d68 52%,#1e283f)}
.art-3{background:
  radial-gradient(circle at 60% 25%,#ffe4a6 0 12%,transparent 34%),
  linear-gradient(135deg,#d86e6a,#6f3a4d 55%,#2b2230)}
.art-4{background:
  radial-gradient(circle at 78% 22%,#e9d8ff 0 12%,transparent 31%),
  linear-gradient(140deg,#a79bc7,#5d6a89 55%,#263049)}
.art-5{background:
  radial-gradient(circle at 28% 22%,#fff1c9 0 11%,transparent 34%),
  linear-gradient(140deg,#dcb594,#987060 55%,#3e3234)}
.art-6{background:
  radial-gradient(circle at 70% 28%,#cde7ff 0 12%,transparent 34%),
  linear-gradient(140deg,#6f8fb0,#394c69 55%,#1f2638)}
.art-7{background:
  radial-gradient(circle at 35% 18%,#ffd4e5 0 12%,transparent 32%),
  linear-gradient(135deg,#b87e9f,#5f4c73 58%,#322842)}
.art-8{background:
  radial-gradient(circle at 60% 20%,#dff4d6 0 13%,transparent 34%),
  linear-gradient(135deg,#76967b,#445d58 55%,#253630)}
.art-letters{
  font-family:Georgia,serif;font-size:40px;line-height:.9;opacity:.22;
  letter-spacing:-.06em;position:absolute;right:16px;top:16px;text-align:right
}
.art-person{
  width:44%;height:76%;
  position:absolute;left:14%;bottom:0;
  border-radius:46% 46% 14% 14% / 26% 26% 8% 8%;
  background:linear-gradient(180deg,#222 0 20%,#4a3442 20% 52%,#d9c7bf 52% 100%);
  opacity:.82;
  filter:drop-shadow(0 10px 15px rgba(0,0,0,.18));
}
.art-person::before{
  content:"";position:absolute;width:58%;aspect-ratio:1;border-radius:50%;
  background:#e6c8bd;left:21%;top:11%;
}
.art-person::after{
  content:"";position:absolute;width:76%;height:28%;
  background:#242333;border-radius:60% 60% 45% 45%;left:12%;top:1%;
}
.art-label{position:relative;z-index:1;font-size:11px;letter-spacing:.15em;opacity:.8}
.meta{padding:10px 2px 0}
.meta-row{display:flex;justify-content:space-between;gap:8px}
.cv{font-weight:750;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rj{font-size:12px;color:#a48391;white-space:nowrap}
.tag-mini{
  display:inline-block;margin-top:7px;padding:2px 6px;border:1px solid #e2bcc8;
  color:#b95b7d;font-size:10px;border-radius:3px;
}
.empty{display:none}

/* full-page archive detail */
.collection-crumb{display:flex;align-items:center;gap:9px;color:#8e7380}
.collection-crumb-main{font-weight:800;color:var(--pink-deep)}
.collection-crumb-sep{color:#d8adb9}
.collection-crumb-sub{font-size:12px;color:#a68b98}

.detail-page{max-width:1280px}
.detail-page-toolbar{
  display:flex;align-items:center;justify-content:space-between;
  margin-bottom:20px;padding-bottom:14px;border-bottom:1px solid var(--line);
}
.back-btn,.more-btn{
  border:0;background:transparent;color:#7b5e6b;padding:8px 0;font-weight:700;
}
.more-btn{font-size:23px;padding:2px 10px}
.detail-page-actions{display:flex;gap:8px;align-items:center}

.archive-sheet{
  background:rgba(255,253,251,.72);
  border-top:2px solid rgba(217,79,131,.38);
  border-bottom:1px solid rgba(221,166,182,.48);
}
.archive-hero{
  display:grid;grid-template-columns:minmax(260px,360px) 1fr;
  gap:42px;padding:34px 12px 36px;
  border-bottom:1px solid var(--line);
}
.detail-cover{aspect-ratio:4/3;border:1px solid var(--line);position:relative;overflow:hidden}
.detail-cover .art-person{left:16%}
.archive-intro{padding:6px 8px 0 0}
.detail-kicker{font-size:11px;letter-spacing:.18em;color:#bd7891;margin-bottom:12px}
.detail-title{font-size:30px;line-height:1.45;margin:0 0 7px;font-weight:800}
.detail-subtitle{font-size:15px;color:#967684;margin-bottom:24px}
.detail-facts{
  display:grid;grid-template-columns:repeat(2,minmax(0,1fr));
  gap:7px 30px;
}
.fact{display:grid;grid-template-columns:72px 1fr;padding:9px 0;border-bottom:1px dotted #ead7dc}
.fact b{color:#bd6b88}
.archive-tags-block{margin-top:22px;display:grid;gap:12px}
.archive-tag-row{display:grid;grid-template-columns:74px 1fr;gap:8px;align-items:start}
.archive-tag-label{font-size:11px;color:#a88996;padding-top:5px}
.detail-tags{display:flex;gap:7px;flex-wrap:wrap}
.keyword{padding:4px 8px;background:#f7efe9;color:#a86f55;font-size:11px}
.librarytag{padding:4px 8px;border:1px solid #d98aa6;color:#b84771;font-size:11px}

.archive-body{
  display:grid;grid-template-columns:1fr 1fr;
  column-gap:44px;padding:0 12px 30px;
}
.archive-section{padding:26px 0;border-bottom:1px solid var(--line)}
.archive-section-title{
  font-size:13px;font-weight:800;color:#b84e75;
  letter-spacing:.1em;margin-bottom:12px;
}
.archive-section p{font-size:13px;line-height:2;margin:0;color:#664e5a}
.rating-table{max-width:420px}
.rating-line{display:grid;grid-template-columns:76px 1fr;gap:10px;font-size:13px;margin:7px 0}
.stars{letter-spacing:.14em;color:#d58a61}
.archive-review{grid-column:1/-1}

/* list mode */
.grid.list-mode{display:block}
.grid.list-mode .record{
  display:grid;grid-template-columns:132px 1fr;
  gap:16px;padding:14px 0;border-bottom:1px solid var(--line);
}
.grid.list-mode .cover{aspect-ratio:4/3}
.grid.list-mode .meta{display:flex;align-items:center;justify-content:space-between}
.grid.list-mode .tag-mini{margin:0}

/* mobile */
.mobile-bottom{display:none}
@media(max-width:1050px){
  .grid{grid-template-columns:repeat(3,minmax(0,1fr))}
}
@media(max-width:760px){
  :root{--sidebar:0px}
  .sidebar{display:none}
  .main{margin-left:0}
  .topbar{height:62px;padding:0 18px}
  .topbar h1{font-size:19px}
  .top-actions .text-btn{display:none}
  .subbar{padding:0 18px;min-height:52px;overflow-x:auto}
  .tabs{height:52px;gap:22px}
  .sub-meta{display:none}
  .workspace{padding:18px 16px 100px}
  .control-row{grid-template-columns:1fr auto;gap:8px}
  .view-toggle{display:none}
  .library-layout{display:block}
  .tag-panel{
    position:static;border:0;padding:0;display:flex;gap:8px;overflow-x:auto;margin-bottom:16px;
  }
  .tag-title,.add-tag{display:none}
  .tag-link{
    width:auto;flex:0 0 auto;border:1px solid var(--line);padding:7px 10px;font-size:12px;
  }
  .tag-link.active{border-color:#dc96ad;background:#fff}
  .tag-count{margin-left:7px}
  .grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:20px 12px}
  .cover-title{display:none}
  .detail-page{padding-bottom:24px}
  .detail-page-toolbar{
    position:sticky;top:62px;z-index:35;
    margin:-18px -16px 18px;padding:10px 16px;
    background:rgba(255,253,251,.94);backdrop-filter:blur(16px);
  }
  .detail-page-actions .text-btn{display:none}
  .archive-sheet{margin:0 -2px}
  .archive-hero{grid-template-columns:1fr;gap:22px;padding:20px 14px 28px}
  .detail-cover{max-width:none;width:100%}
  .archive-intro{padding:0}
  .detail-title{font-size:22px}
  .detail-facts{grid-template-columns:1fr}
  .archive-body{grid-template-columns:1fr;padding:0 14px 24px}
  .archive-review{grid-column:auto}
  body.detail-open .mobile-bottom{display:none}
  .mobile-bottom{
    position:fixed;display:grid;grid-template-columns:repeat(3,1fr);
    left:0;right:0;bottom:0;height:70px;z-index:90;
    background:rgba(255,253,251,.94);backdrop-filter:blur(18px);
    border-top:1px solid var(--line);
    padding-bottom:env(safe-area-inset-bottom);
  }
  .mobile-bottom button{
    border:0;background:transparent;color:#6e5762;font-weight:700;font-size:12px;
  }
  .mobile-bottom button.active{color:var(--pink)}
}
</style>
</head>
<body>
<div class="app">
  <aside class="sidebar">
    <div class="brand">
      <div class="brand-main"><span class="brand-mark">✦</span>乙抓记录</div>
      <div class="brand-sub">OTOME VOICE LOG</div>
    </div>

    <div class="nav-label">制作</div>
    <button class="nav-item">
      <svg viewBox="0 0 24 24"><path d="M4 5h16v14H4z"/><path d="M8 5v14"/></svg>
      模板编辑
    </button>
    <button class="nav-item">
      <svg viewBox="0 0 24 24"><path d="M4 19l5-5 4 4 7-8"/><path d="M14 7h6v6"/></svg>
      修图工具
    </button>

    <div class="nav-label">管理</div>
    <button class="nav-item active">
      <svg viewBox="0 0 24 24"><path d="M20.8 4.6a5.4 5.4 0 0 0-7.6 0L12 5.8l-1.2-1.2a5.4 5.4 0 0 0-7.6 7.6L12 21l8.8-8.8a5.4 5.4 0 0 0 0-7.6z"/></svg>
      我的收藏
    </button>

    <div class="sidebar-foot">本地保存 · JSON 可导入导出</div>
  </aside>

  <main class="main">
    <header class="topbar">
      <h1>我的收藏</h1>
      <div class="top-actions">
        <button class="text-btn">导入备份</button>
        <button class="text-btn">导出备份</button>
        <button class="primary-btn">＋ 新建记录</button>
      </div>
    </header>

    <section class="subbar">
      <div class="collection-crumb">
        <span class="collection-crumb-main">收藏柜</span>
        <span class="collection-crumb-sep">/</span>
        <span class="collection-crumb-sub">管理已保存的乙抓记录</span>
      </div>
      <div class="sub-meta"><span id="countText">8 条记录</span></div>
    </section>

    <section class="workspace" id="libraryView">
      <div class="control-row">
        <label class="searchbox">
          <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/></svg>
          <input id="search" placeholder="搜索标题 / RJ / CV / 社团 / 标签…" />
        </label>

        <select id="sort" class="sort-select">
          <option value="recent">最近编辑</option>
          <option value="rating">评分高 → 低</option>
          <option value="price">购入价低 → 高</option>
          <option value="cv">CV 名称</option>
        </select>

        <div class="view-toggle">
          <button class="icon-btn active" id="gridBtn" title="网格视图">
            <svg viewBox="0 0 24 24"><rect x="4" y="4" width="6" height="6"/><rect x="14" y="4" width="6" height="6"/><rect x="4" y="14" width="6" height="6"/><rect x="14" y="14" width="6" height="6"/></svg>
          </button>
          <button class="icon-btn" id="listBtn" title="列表视图">
            <svg viewBox="0 0 24 24"><path d="M8 6h12M8 12h12M8 18h12"/><circle cx="4" cy="6" r="1"/><circle cx="4" cy="12" r="1"/><circle cx="4" cy="18" r="1"/></svg>
          </button>
        </div>
      </div>

      <div class="library-layout">
        <aside class="tag-panel">
          <div class="tag-title">收藏标签</div>
          <button class="tag-link active" data-tag="all"><span>全部</span><span class="tag-count">8</span></button>
          <button class="tag-link" data-tag="喜欢"><span>喜欢</span><span class="tag-count">4</span></button>
          <button class="tag-link" data-tag="一般"><span>一般</span><span class="tag-count">2</span></button>
          <button class="tag-link" data-tag="史低90"><span>史低90</span><span class="tag-count">3</span></button>
          <button class="tag-link" data-tag="待重听"><span>待重听</span><span class="tag-count">3</span></button>
          <button class="tag-link" data-tag="2026TOP"><span>2026 TOP</span><span class="tag-count">2</span></button>
          <button class="tag-link add-tag"><span>＋ 新建标签</span></button>
        </aside>

        <div id="grid" class="grid"></div>
      </div>
    </section>
  </main>

  <nav class="mobile-bottom">
    <button>▣<br>模板编辑</button>
    <button>✎<br>修图工具</button>
    <button class="active">♡<br>我的收藏</button>
  </nav>
</div>


    <section class="workspace detail-page" id="detailView" hidden>
      <div class="detail-page-toolbar">
        <button class="back-btn" id="backToLibrary">← 返回我的收藏</button>
        <div class="detail-page-actions">
          <button class="text-btn">生成分享图</button>
          <button class="primary-btn">编辑档案</button>
          <button class="more-btn" id="detailMore">⋯</button>
        </div>
      </div>

      <article class="archive-sheet">
        <header class="archive-hero">
          <div class="detail-cover">
            <div class="cover-art art-1">
              <div class="art-letters">VOICE<br>LOG</div>
              <div class="art-person"></div>
            </div>
          </div>

          <div class="archive-intro">
            <div class="detail-kicker">OTOME VOICE ARCHIVE</div>
            <h2 class="detail-title" id="detailTitle"></h2>
            <div class="detail-subtitle" id="detailCn"></div>

            <div class="detail-facts">
              <div class="fact"><b>CV</b><span id="detailCv"></span></div>
              <div class="fact"><b>社团</b><span id="detailCircle"></span></div>
              <div class="fact"><b>RJ</b><span id="detailRj"></span></div>
              <div class="fact"><b>时长</b><span id="detailTime"></span></div>
              <div class="fact"><b>购入价</b><span id="detailPrice"></span></div>
              <div class="fact"><b>评分</b><span id="detailRating"></span></div>

const records = [

let currentTag = "all";
let currentView = "grid";
const grid = document.getElementById("grid");
const search = document.getElementById("search");
const sort = document.getElementById("sort");
const libraryView = document.getElementById("libraryView");
const detailView = document.getElementById("detailView");
let libraryScrollY = 0;

function cardTemplate(r){
  return `
  <article class="record" data-id="${r.id}">
    <div class="cover">
      <div class="cover-art ${r.art}">
        <div class="art-letters">VOICE<br>LOG</div>
        <div class="art-person"></div>
        <div class="art-label">乙女向け · DRAMA CD</div>
      </div>
      <div class="cover-title">${r.title}</div>
    </div>
    <div class="meta">
      <div class="meta-row">
        <div class="cv">${r.cv}</div>
        <div class="rj">${r.rj}</div>
      </div>
      <span class="tag-mini">${r.tags[0] ?? "未分类"}</span>
    </div>
  </article>`;
}

function getVisible(){
  const q = search.value.trim().toLowerCase();
  let list = records.filter(r => currentTag === "all" || r.tags.includes(currentTag));
  if(q){
    list = list.filter(r =>
      [r.title,r.cn,r.cv,r.rj,r.circle,...r.tags,...r.keywords].join(" ").toLowerCase().includes(q)
    );
  }
  if(sort.value === "rating") list.sort((a,b)=>b.rating-a.rating);
  if(sort.value === "price") list.sort((a,b)=>a.price-b.price);
  if(sort.value === "cv") list.sort((a,b)=>a.cv.localeCompare(b.cv,"ja"));
  return list;
}

function render(){
  const list = getVisible();
  grid.innerHTML = list.map(cardTemplate).join("");
  grid.classList.toggle("list-mode",currentView==="list");
  document.getElementById("countText").textContent = `${list.length} 条记录`;
  document.querySelectorAll(".record").forEach(el=>{
    el.addEventListener("click",()=>openDetail(Number(el.dataset.id)));
  });
}

function openDetail(id){
  const r = records.find(x=>x.id===id);
  document.getElementById("detailTitle").textContent=r.title;
  document.getElementById("detailCn").textContent=r.cn;
  document.getElementById("detailCv").textContent=r.cv;
  document.getElementById("detailCircle").textContent=r.circle;
  document.getElementById("detailRj").textContent=r.rj;
  document.getElementById("detailTime").textContent=r.time;
  document.getElementById("detailPrice").textContent=`¥${r.price}`;
  document.getElementById("detailRating").textContent=r.rating.toFixed(1);
  document.getElementById("detailSummary").textContent=r.summary;
  document.getElementById("detailCharacter").textContent=r.character;
  document.getElementById("detailReview").textContent=r.review;

  const kw = document.getElementById("detailKeywords");
  kw.innerHTML = r.keywords.map(x=>`<span class="keyword">${x}</span>`).join("");
  const lt = document.getElementById("detailLibraryTags");
  lt.innerHTML = r.tags.map(x=>`<span class="librarytag">${x}</span>`).join("");

  const art = detailView.querySelector(".detail-cover .cover-art");
  art.className = `cover-art ${r.art}`;
    libraryScrollY = window.scrollY;
  libraryView.hidden = true;
  detailView.hidden = false;
  document.body.classList.add("detail-open");
  document.querySelector(".topbar h1").textContent = "作品档案";
  window.scrollTo({top:0, behavior:"instant"});
}

document.querySelectorAll(".tag-link[data-tag]").forEach(btn=>{
  btn.addEventListener("click",()=>{
    document.querySelectorAll(".tag-link[data-tag]").forEach(x=>x.classList.remove("active"));
    btn.classList.add("active");
    currentTag=btn.dataset.tag;
    render();
  });
});
search.addEventListener("input",render);
sort.addEventListener("change",render);
document.getElementById("gridBtn").addEventListener("click",()=>{
  currentView="grid";
  document.getElementById("gridBtn").classList.add("active");
  document.getElementById("listBtn").classList.remove("active");
  render();
});
document.getElementById("listBtn").addEventListener("click",()=>{
  currentView="list";
  document.getElementById("listBtn").classList.add("active");
  document.getElementById("gridBtn").classList.remove("active");
  render();
});
document.getElementById("backToLibrary").addEventListener("click",()=>{
  detailView.hidden = true;
  libraryView.hidden = false;
  document.body.classList.remove("detail-open");
  document.querySelector(".topbar h1").textContent = "我的收藏";
  requestAnimationFrame(()=>window.scrollTo({top:libraryScrollY, behavior:"instant"}));
});
render();
</script>
