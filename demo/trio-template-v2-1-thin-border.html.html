<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>乙抓记录｜三作版 Demo</title>
<style>
:root{
  --ink:#684957;
  --muted:#9a7480;
  --accent:#f2a2b6;
  --accent-deep:#bf527c;
  --mint:#9fc9b8;
  --line:#f7c7d2;
  --paper:#fffaf7;
  --cover-bg:#fce9e4;
  --shadow:0 18px 45px rgba(104,73,87,.16);
}
*{box-sizing:border-box}
body{
  margin:0;
  padding:28px 18px 56px;
  color:var(--ink);
  font-family:"Microsoft YaHei","PingFang SC","Noto Sans CJK SC",Arial,sans-serif;
  background:
    radial-gradient(circle at 12% 8%,rgba(255,235,222,.95),transparent 30%),
    radial-gradient(circle at 88% 18%,rgba(216,238,230,.88),transparent 28%),
    linear-gradient(135deg,#fff2f5,#fffdf8 48%,#f5faf6);
}
button,input,textarea{font:inherit}
.demo-shell{
  min-height:100vh;
  display:grid;
  justify-items:center;
  gap:18px;
}
.demo-head{
  width:min(100%,1080px);
}
.demo-head h1{
  margin:0;
  color:var(--accent-deep);
  font-size:24px;
}
.demo-head p{
  margin:5px 0 0;
  color:var(--muted);
  font-size:13px;
}
.preview-wrap{
  width:min(100%,1080px);
  display:grid;
  justify-items:center;
}
.scaler{
  width:1080px;
  height:1440px;
  transform-origin:top left;
}

/* ===== 模板本体 ===== */
.trio-card{
  position:relative;
  width:1080px;
  height:1440px;
  overflow:hidden;
  border-radius:44px;
  box-shadow:var(--shadow);
  background:
    linear-gradient(90deg,rgba(255,255,255,.34) 1px,transparent 1px) 0 0/36px 36px,
    linear-gradient(rgba(255,255,255,.30) 1px,transparent 1px) 0 0/36px 36px,
    linear-gradient(145deg,#fff8f4 0%,#fffdf9 48%,#f5f8f4 100%);
}
.trio-card::before{
  content:"";
  position:absolute;
  inset:16px;
  border:3px solid color-mix(in srgb,var(--line) 78%,transparent);
  border-radius:30px;
  pointer-events:none;
}
.trio-card::after{
  content:"";
  position:absolute;
  inset:30px;
  border:2px dashed color-mix(in srgb,var(--mint) 58%,transparent);
  border-radius:22px;
  pointer-events:none;
}

.trio-list{
  position:absolute;
  inset:58px 62px 58px;
  z-index:1;
  display:grid;
  grid-template-rows:repeat(3,minmax(0,1fr));
  gap:30px;
}

/* 单作区域：不画完整大框，只用轻底和留白 */
.trio-item{
  position:relative;
  min-height:0;
  display:grid;
  grid-template-columns:400px minmax(0,1fr);
  gap:24px;
  align-items:center;
  padding:16px 20px;
  border-radius:26px;
  border:1px solid color-mix(in srgb,var(--line) 72%,transparent);
  background:
    radial-gradient(circle at 7% 10%, color-mix(in srgb,var(--accent) 7%,transparent), transparent 28%),
    radial-gradient(circle at 93% 90%, color-mix(in srgb,var(--mint) 7%,transparent), transparent 24%),
    linear-gradient(135deg,rgba(255,255,255,.62),rgba(255,255,255,.28));
}
.trio-item:not(:last-child)::after{
  content:"";
  position:absolute;
  left:70px;
  right:70px;
  bottom:-18px;
  height:1px;
  background:
    repeating-linear-gradient(
      90deg,
      color-mix(in srgb,var(--accent) 38%,transparent) 0 5px,
      transparent 5px 11px
    ) left center / calc(50% - 15px) 1px no-repeat,
    repeating-linear-gradient(
      90deg,
      color-mix(in srgb,var(--mint) 42%,transparent) 0 5px,
      transparent 5px 11px
    ) right center / calc(50% - 15px) 1px no-repeat;
}
.trio-divider-star{
  position:absolute;
  left:50%;
  bottom:-25px;
  z-index:2;
  width:14px;
  height:14px;
  transform:translateX(-50%);
  clip-path:polygon(
    50% 0%,61% 35%,98% 35%,68% 57%,79% 93%,
    50% 72%,21% 93%,32% 57%,2% 35%,39% 35%
  );
  background:color-mix(in srgb,var(--accent) 64%,white);
}
.trio-item:last-child .trio-divider-star{display:none}

/* 单作块内部的轻杂志装饰：左上粉色 ✦ + 短线，右下薄荷绿短线 + ✦ */
.trio-corner-deco{
  position:absolute;
  z-index:2;
  display:flex;
  align-items:center;
  gap:8px;
  pointer-events:none;
  opacity:.72;
}
.trio-corner-deco .deco-star{
  font-size:13px;
  line-height:1;
}
.trio-corner-deco .deco-line{
  width:62px;
  height:1px;
  border-radius:999px;
  background:currentColor;
}
.trio-corner-deco.top-left{
  left:28px;
  top:10px;
  color:color-mix(in srgb,var(--accent) 72%,transparent);
}
.trio-corner-deco.bottom-right{
  right:28px;
  bottom:10px;
  flex-direction:row-reverse;
  color:color-mix(in srgb,var(--mint) 76%,transparent);
}

/* ===== BK ===== */
.cover-wrap{
  position:relative;
  width:400px;
  aspect-ratio:4/3;
  align-self:center;
  border-radius:20px;
  overflow:hidden;
  cursor:pointer;
  background:color-mix(in srgb,var(--cover-bg) 58%,white);
  border:2px dashed color-mix(in srgb,var(--accent) 42%,transparent);
}
.cover-wrap.has-image{
  border:3px solid rgba(255,255,255,.98);
  box-shadow:
    0 0 0 1px color-mix(in srgb,var(--line) 82%,transparent),
    0 10px 22px rgba(104,73,87,.13);
}
.cover-file{display:none}
.cover-image{
  position:absolute;
  inset:0;
  width:100%;
  height:100%;
  object-fit:cover;
  display:none;
}
.cover-wrap.has-image .cover-image{display:block}
.cover-placeholder{
  position:absolute;
  inset:0;
  display:grid;
  place-items:center;
  color:var(--muted);
  font-size:18px;
  font-weight:900;
}
.cover-wrap.has-image .cover-placeholder{display:none}

/* 仅视觉演示：hover 显示工具条 */
.cover-tools{
  position:absolute;
  left:10px;
  right:10px;
  top:10px;
  z-index:3;
  display:flex;
  gap:6px;
  padding:6px;
  border-radius:13px;
  background:rgba(255,255,255,.86);
  backdrop-filter:blur(7px);
  box-shadow:0 4px 12px rgba(104,73,87,.12);
  opacity:0;
  transform:translateY(-4px);
  pointer-events:none;
  transition:.14s ease;
}
.cover-wrap.has-image:hover .cover-tools{
  opacity:1;
  transform:translateY(0);
}
.cover-tool{
  flex:1;
  display:grid;
  place-items:center;
  height:27px;
  border-radius:999px;
  border:1px solid rgba(217,95,140,.16);
  color:var(--accent-deep);
  background:rgba(255,255,255,.94);
  font-size:11px;
  font-weight:900;
}

/* ===== 右侧信息 ===== */
.info{
  min-width:0;
  height:100%;
  display:grid;
  grid-template-rows:auto auto 1fr;
  align-content:center;
  gap:12px;
  padding:4px 2px;
}

/* 第一行 CV + RJ */
.info-row{
  display:grid;
  grid-template-columns:minmax(0,1fr) auto;
  gap:22px;
  align-items:center;
}
.inline-field{
  min-width:0;
  display:flex;
  align-items:center;
  gap:9px;
}
.field-label{
  flex:0 0 auto;
  color:var(--accent);
  font-size:19px;
  font-weight:900;
}
.field-input{
  min-width:0;
  flex:1 1 auto;
  border:0;
  outline:0;
  padding:0;
  color:var(--ink);
  background:transparent;
  font-size:19px;
  line-height:1.15;
  font-weight:900;
}
.rj-input{
  width:132px;
  border:0;
  outline:0;
  padding:0;
  color:var(--ink);
  background:transparent;
  text-align:left;
  font-size:16px;
  font-weight:850;
}
.field-input::placeholder,
.rj-input::placeholder{
  color:color-mix(in srgb,var(--muted) 48%,transparent);
}
.top-divider{
  grid-column:1/-1;
  border-top:1px dashed color-mix(in srgb,var(--accent) 30%,transparent);
}

/* 第二行：价格 + 总评分 */
.summary-strip{
  min-height:54px;
  display:grid;
  grid-template-columns:1fr 1.4fr;
  gap:16px;
  align-items:center;
  padding:8px 13px;
  border-radius:16px;
  background:
    linear-gradient(
      90deg,
      color-mix(in srgb,var(--accent) 7%,transparent),
      color-mix(in srgb,var(--mint) 7%,transparent)
    );
}
.price-block,
.rating-block{
  display:flex;
  align-items:center;
  gap:9px;
  min-width:0;
}
.small-label{
  color:var(--muted);
  font-size:14px;
  font-weight:900;
}
.price-input{
  width:92px;
  border:0;
  outline:0;
  padding:0;
  color:var(--accent-deep);
  background:transparent;
  font-size:23px;
  line-height:1;
  font-weight:900;
}
.stars{
  display:flex;
  align-items:center;
  gap:4px;
}
.star{
  width:25px;
  height:25px;
  display:grid;
  place-items:center;
  border:0;
  padding:0;
  background:transparent;
  color:var(--accent);
  cursor:pointer;
  font-size:25px;
  line-height:1;
}
.star.off{
  color:color-mix(in srgb,var(--accent) 26%,transparent);
}
.score{
  color:var(--accent-deep);
  font-size:16px;
  font-weight:900;
}

/* Repo：右侧中下半区域 */
.repo{
  position:relative;
  min-height:0;
  padding:13px 10px 9px 22px;
  background:
    linear-gradient(
      90deg,
      color-mix(in srgb,var(--accent) 15%,transparent) 0 3px,
      transparent 3px 100%
    );
}
.repo::before{
  content:"♡";
  position:absolute;
  left:2px;
  top:11px;
  color:color-mix(in srgb,var(--accent-deep) 50%,transparent);
  font-size:15px;
  font-weight:900;
}
.repo-title{
  margin-bottom:5px;
  color:var(--accent-deep);
  font-size:13px;
  letter-spacing:.08em;
  font-weight:900;
}
.repo textarea{
  width:100%;
  height:160px;
  resize:none;
  overflow:hidden;
  border:0;
  outline:0;
  padding:0;
  color:var(--ink);
  background:transparent;
  font-size:16px;
  line-height:1.58;
  font-weight:700;
}
.repo textarea::placeholder{
  color:color-mix(in srgb,var(--muted) 47%,transparent);
}

.watermark{
  position:absolute;
  right:54px;
  bottom:34px;
  z-index:2;
  color:color-mix(in srgb,var(--ink) 9%,transparent);
  font-size:12px;
  letter-spacing:.14em;
  font-weight:800;
}

/* 模板外按钮，仅 Demo */
.demo-tools{
  width:min(100%,1080px);
  display:flex;
  justify-content:center;
  gap:9px;
  flex-wrap:wrap;
  padding:11px 14px;
  border:1px solid rgba(217,95,140,.18);
  border-radius:18px;
  background:rgba(255,255,255,.72);
}
.tool-btn{
  min-height:38px;
  padding:0 15px;
  border:1px solid rgba(217,95,140,.24);
  border-radius:999px;
  color:var(--accent-deep);
  background:#fff;
  cursor:pointer;
  font-weight:900;
}

@media(max-width:800px){
  .demo-head{display:block}
}
</style>
</head>
<body>
<div class="demo-shell">
  <div class="demo-head">
    <h1>三作版｜第二版-细描边 Demo</h1>
    <p>1080×1440 · 3部纵向 · BK放大 · 轻杂志装饰 · 三块细实线描边</p>
  </div>

  <div class="preview-wrap" id="previewWrap">
    <div class="scaler" id="scaler">
      <section class="trio-card">
        <div class="trio-list" id="trioList"></div>
        <div class="watermark">乙抓记录 · THREE VOICE NOTES</div>
      </section>
    </div>
  </div>

  <div class="demo-tools">
    <button class="tool-btn" id="fillBtn">填充示例</button>
    <button class="tool-btn" id="clearRepoBtn">只清空Repo</button>
  </div>
</div>

<script>
const samples=[
  {
    cv:"一条ひらめ",
    rj:"RJ01152097",
    price:"¥154",
    score:4,
    repo:"青梅竹马感很自然，前半纯情得可爱，后半反差也很香。男主一直像哥哥一样照顾你，情绪推进很顺，属于会让我想回去二刷的类型。"
  },
  {
    cv:"猿飛総司",
    rj:"RJ01490772",
    price:"¥770",
    score:5,
    repo:"声线太适合贴耳低语了，听感非常舒服。剧情本身不复杂，但氛围和距离感做得很好，戴耳机听的时候沉浸感尤其强。"
  },
  {
    cv:"テトラポット登",
    rj:"RJ01318251",
    price:"¥990",
    score:4,
    repo:"整体节奏很稳，互动感也够。不是那种第一耳特别炸的作品，但会越听越顺，属于放松的时候很容易重新点开的那一类。"
  }
];

function coverSvg(index){
  const palettes=[
    ["#f2c3d1","#704f63"],
    ["#cfd9ee","#586583"],
    ["#eed3cc","#966571"]
  ];
  const [a,b]=palettes[index];
  const svg=`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 420">
    <defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop stop-color="${a}"/><stop offset="1" stop-color="#fff9fb"/></linearGradient></defs>
    <rect width="560" height="420" fill="url(#g)"/>
    <circle cx="430" cy="100" r="88" fill="${b}" opacity=".12"/>
    <circle cx="115" cy="325" r="105" fill="${b}" opacity=".08"/>
    <path d="M215 395c8-108 35-194 121-199 86-6 132 65 114 145-13 62-55 99-121 100-53 1-94-17-114-46z" fill="${b}" opacity=".82"/>
    <circle cx="334" cy="160" r="69" fill="#f7dfd4"/>
    <path d="M271 162c14-82 117-85 131-5-30-34-92-36-131 5z" fill="${b}"/>
    <text x="34" y="54" font-family="Arial,sans-serif" font-size="26" font-weight="700" fill="${b}">OTOME VOICE</text>
    <text x="35" y="84" font-family="Arial,sans-serif" font-size="15" fill="${b}" opacity=".66">0${index+1}</text>
  </svg>`;
  return "data:image/svg+xml;charset=utf-8,"+encodeURIComponent(svg);
}

const list=document.getElementById("trioList");

for(let i=0;i<3;i++){
  const item=document.createElement("article");
  item.className="trio-item";
  item.innerHTML=`
    <span class="trio-divider-star"></span>
    <span class="trio-corner-deco top-left">
      <span class="deco-star">✦</span><span class="deco-line"></span>
    </span>
    <span class="trio-corner-deco bottom-right">
      <span class="deco-star">✦</span><span class="deco-line"></span>
    </span>

    <label class="cover-wrap has-image">
      <input class="cover-file" type="file" accept="image/*">
      <img class="cover-image" alt="">
      <span class="cover-placeholder">点击上传 BK</span>
      <div class="cover-tools">
        <span class="cover-tool">完整</span>
        <span class="cover-tool">裁切</span>
        <span class="cover-tool">编辑</span>
        <span class="cover-tool">移除</span>
      </div>
    </label>

    <div class="info">
      <div class="info-row">
        <label class="inline-field">
          <span class="field-label">CV</span>
          <input class="field-input cv" placeholder="填写声优">
        </label>
        <label class="inline-field">
          <span class="field-label">RJ</span>
          <input class="rj-input" placeholder="RJ00000000">
        </label>
        <div class="top-divider"></div>
      </div>

      <div class="summary-strip">
        <label class="price-block">
          <span class="small-label">现价</span>
          <input class="price-input" placeholder="¥0">
        </label>

        <div class="rating-block">
          <span class="small-label">总评</span>
          <div class="stars">
            ${[1,2,3,4,5].map(n=>`<button type="button" class="star" data-score="${n}">★</button>`).join("")}
          </div>
          <span class="score">5.0</span>
        </div>
      </div>

      <div class="repo">
        <div class="repo-title">REPO</div>
        <textarea maxlength="220" placeholder="写下这部作品的 Repo…"></textarea>
      </div>
    </div>
  `;
  list.append(item);

  const cover=item.querySelector(".cover-wrap");
  const file=item.querySelector(".cover-file");
  const img=item.querySelector(".cover-image");

  img.src=coverSvg(i);

  file.addEventListener("change",()=>{
    const f=file.files&&file.files[0];
    file.value="";
    if(!f)return;
    const reader=new FileReader();
    reader.onload=()=>{
      img.src=reader.result;
      cover.classList.add("has-image");
    };
    reader.readAsDataURL(f);
  });

  const stars=[...item.querySelectorAll(".star")];
  const scoreEl=item.querySelector(".score");
  stars.forEach(btn=>{
    btn.addEventListener("click",()=>{
      const score=Number(btn.dataset.score);
      stars.forEach((s,idx)=>s.classList.toggle("off",idx>=score));
      scoreEl.textContent=score.toFixed(1);
    });
  });
}

function fill(){
  [...document.querySelectorAll(".trio-item")].forEach((item,i)=>{
    const d=samples[i];
    item.querySelector(".cv").value=d.cv;
    item.querySelector(".rj-input").value=d.rj;
    item.querySelector(".price-input").value=d.price;
    item.querySelector("textarea").value=d.repo;
    item.querySelector(".cover-image").src=coverSvg(i);
    item.querySelector(".cover-wrap").classList.add("has-image");
    const stars=[...item.querySelectorAll(".star")];
    stars.forEach((s,idx)=>s.classList.toggle("off",idx>=d.score));
    item.querySelector(".score").textContent=d.score.toFixed(1);
  });
}
fill();

document.getElementById("fillBtn").onclick=fill;
document.getElementById("clearRepoBtn").onclick=()=>{
  document.querySelectorAll(".repo textarea").forEach(x=>x.value="");
};

function fitPreview(){
  const wrap=document.getElementById("previewWrap");
  const scaler=document.getElementById("scaler");
  const scale=Math.min(1,wrap.clientWidth/1080);
  scaler.style.transform=`scale(${scale})`;
  wrap.style.height=(1440*scale)+"px";
}
fitPreview();
window.addEventListener("resize",fitPreview);
</script>
</body>
</html>
