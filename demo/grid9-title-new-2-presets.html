<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>九宫格标题新样式 Demo</title>
<style>
:root{
  --ink:#61485f;
  --muted:#9c7184;
  --accent:#f48fb8;
  --accent2:#9a78df;
  --mint:#9fc9b8;
}
*{box-sizing:border-box}
body{
  margin:0;
  padding:28px 16px 56px;
  font-family:"Microsoft YaHei","PingFang SC","Noto Sans CJK SC",sans-serif;
  color:var(--ink);
  background:
    radial-gradient(circle at 10% 8%,rgba(255,230,238,.85),transparent 28%),
    radial-gradient(circle at 90% 16%,rgba(222,239,233,.75),transparent 26%),
    linear-gradient(135deg,#fff5f8,#fffdf9 50%,#f5faf7);
}
.page{width:min(1180px,100%);margin:auto}
h1{margin:0 0 6px;color:#c65b84;font-size:25px}
.intro{margin:0 0 20px;color:var(--muted);font-size:14px}
.stack{display:grid;gap:20px}
.demo{
  position:relative;
  overflow:hidden;
  min-height:340px;
  padding:40px 34px 34px;
  border:1px solid rgba(242,174,198,.72);
  border-radius:28px;
  background:
    linear-gradient(90deg,rgba(255,255,255,.30) 1px,transparent 1px) 0 0/34px 34px,
    linear-gradient(rgba(255,255,255,.27) 1px,transparent 1px) 0 0/34px 34px,
    linear-gradient(145deg,#fff9f7,#fffdf9 52%,#f7faf7);
  box-shadow:0 12px 28px rgba(104,73,87,.08);
}
.badge{
  position:absolute;top:14px;left:17px;
  padding:5px 11px;border-radius:999px;
  color:#fff;background:linear-gradient(135deg,var(--accent),var(--accent2));
  font-size:12px;font-weight:900
}
.header{
  min-height:260px;
  display:grid;
  place-items:center;
  align-content:center;
  text-align:center;
}
.kicker{
  margin-bottom:10px;
  color:var(--accent);
  font-size:13px;
  font-weight:900;
  letter-spacing:.30em;
}
.editable{outline:0;cursor:text;overflow-wrap:anywhere}
.editable:empty::before{content:attr(data-placeholder);color:rgba(155,111,125,.36)}
.subtitle{
  position:relative;
  margin-top:17px;
  max-width:780px;
  padding:0 36px;
  outline:0;
  color:var(--muted);
  font-size:20px;
  line-height:1.4;
  font-weight:850;
}
.subtitle::before,.subtitle::after{
  content:"♡";
  position:absolute;top:0;
  color:color-mix(in srgb,var(--accent) 62%,transparent);
  font-size:15px
}
.subtitle::before{left:8px}.subtitle::after{right:8px}
.caption{
  margin-top:18px;
  padding-top:11px;
  border-top:1px dashed rgba(217,95,140,.18);
  color:var(--muted);
  font-size:13px;
}
.controls{
  display:flex;flex-wrap:wrap;gap:8px;
  margin-top:20px
}
.controls button{
  min-height:36px;
  padding:0 13px;
  border:1px solid rgba(217,95,140,.22);
  border-radius:999px;
  color:#bd527b;
  background:rgba(255,255,255,.88);
  font-weight:850;
  cursor:pointer
}

/* D：双色切半 + 上下夹线 */
.d-title-wrap{
  position:relative;
  display:inline-grid;
  place-items:center;
  max-width:940px;
  padding:18px 24px 12px;
}
.d-lines{
  position:absolute;
  inset:0;
  pointer-events:none;
}
.d-lines .line{
  position:absolute;
  left:50%;
  transform:translateX(-50%);
  width:min(88%,760px);
  height:1px;
  background:
    linear-gradient(
      90deg,
      rgba(244,143,184,.58),
      rgba(244,143,184,.22) 45%,
      rgba(154,120,223,.22) 55%,
      rgba(154,120,223,.58)
    );
}
.d-lines .line.top{top:0}
.d-lines .line.bottom{bottom:0}
.d-lines .spark{
  position:absolute;
  left:50%;
  transform:translateX(-50%);
  color:rgba(244,143,184,.76);
  font-size:16px;
  line-height:1;
}
.d-lines .spark.top{top:-8px}
.d-lines .spark.bottom{bottom:-8px}
.d-title{
  position:relative;
  z-index:1;
  max-width:900px;
  font-size:58px;
  line-height:1.14;
  font-weight:950;
  background:linear-gradient(180deg,#61485f 0 48%, #cb739f 48% 100%);
  -webkit-background-clip:text;
  background-clip:text;
  color:transparent;
  -webkit-text-stroke:2px rgba(255,248,251,.94);
  paint-order:stroke fill;
  text-shadow:0 8px 14px rgba(115,83,110,.08);
}

/* E：糖霜立体 + 波浪刷痕 */
.e-title-wrap{
  position:relative;
  display:inline-grid;
  place-items:center;
  max-width:960px;
  padding:0 20px 14px;
}
.e-wave{
  position:absolute;
  left:50%;
  top:54px;
  transform:translateX(-50%);
  width:min(90%,760px);
  height:36px;
  pointer-events:none;
  z-index:0;
}
.e-wave svg{
  width:100%;
  height:100%;
  display:block;
}
.e-title{
  position:relative;
  z-index:1;
  max-width:900px;
  font-size:58px;
  line-height:1.14;
  font-weight:950;
  color:var(--ink);
  -webkit-text-stroke:5px rgba(255,250,252,.98);
  paint-order:stroke fill;
  text-shadow:
    2px 3px 0 rgba(244,143,184,.50),
    4px 6px 0 rgba(154,120,223,.18),
    0 10px 16px rgba(119,83,110,.08);
}

@media(max-width:720px){
  .demo{padding:42px 18px 30px}
  .d-title,.e-title{font-size:40px}
  .subtitle{font-size:16px}
  .e-wave{top:38px;height:28px}
}
</style>
</head>
<body>
<main class="page">
  <h1>九宫格主标题｜两种新样式 Demo</h1>
  <p class="intro">按照之前三方案的方式做成套预设，不再拆字效和装饰。主标题、副标题都可以直接编辑。</p>

  <section class="stack">
    <article class="demo">
      <span class="badge">D · 双色切半 + 上下夹线</span>
      <div class="header">
        <div class="kicker">SITUATION ✦ VOICE</div>
        <div class="d-title-wrap">
          <div class="d-lines">
            <span class="line top"></span>
            <span class="spark top">✦</span>
            <span class="line bottom"></span>
            <span class="spark bottom">✦</span>
          </div>
          <div class="d-title editable title-source" contenteditable="true" data-placeholder="填写主标题">2026上半年总结测试文本</div>
        </div>
        <div class="subtitle editable" contenteditable="true" data-placeholder="填写副标题">测试文本测试文本测试文本</div>
      </div>
      <div class="caption">偏清爽栏目感。标题本身双色切半，外面用上下夹线收住，结构感很强。</div>
    </article>

    <article class="demo">
      <span class="badge">E · 糖霜立体 + 波浪刷痕</span>
      <div class="header">
        <div class="kicker">SITUATION ✦ VOICE</div>
        <div class="e-title-wrap">
          <div class="e-wave">
            <svg viewBox="0 0 760 36" fill="none" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="none">
              <path d="M8 22 C72 4, 142 31, 212 18 S354 2, 425 18 S568 31, 648 16 S726 10, 752 18" stroke="rgba(244,143,184,.42)" stroke-width="16" stroke-linecap="round"/>
              <path d="M40 19 C97 10, 156 28, 220 18 S362 8, 437 20 S568 28, 649 18 S723 11, 748 16" stroke="rgba(154,120,223,.16)" stroke-width="10" stroke-linecap="round"/>
            </svg>
          </div>
          <div class="e-title editable title-source" contenteditable="true" data-placeholder="填写主标题">2026上半年总结测试文本</div>
        </div>
        <div class="subtitle editable" contenteditable="true" data-placeholder="填写副标题">测试文本测试文本测试文本</div>
      </div>
      <div class="caption">偏可爱甜感。标题更厚、更像糖霜字，底下的波浪刷痕会让标题区更活泼。</div>
    </article>
  </section>

  <div class="controls">
    <button data-title="近期BEST9" data-sub="最近喜欢的几张">测试短标题</button>
    <button data-title="那些让我听完以后立刻想再点开第二遍的乙抓个人主观总结" data-sub="不分先后，只记录这一阶段的个人偏好">测试超长标题</button>
    <button data-title="一条ひらめ作品个人偏好记录" data-sub="完全主观，仅代表个人口味">测试无数字标题</button>
    <button data-title="2026上半年总结测试文本" data-sub="测试文本测试文本测试文本">恢复示例</button>
  </div>
</main>

<script>
const demos=[...document.querySelectorAll(".demo")];
document.querySelectorAll(".controls button").forEach(btn=>{
  btn.addEventListener("click",()=>{
    demos.forEach(d=>{
      d.querySelector(".title-source").textContent=btn.dataset.title;
      d.querySelector(".subtitle").textContent=btn.dataset.sub;
    });
  });
});
</script>
</body>
</html>
