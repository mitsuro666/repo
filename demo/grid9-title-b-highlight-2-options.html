<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>九宫格标题区｜B方案高光对比</title>
<style>
:root{
  --ink:#684957;
  --muted:#9b6f7d;
  --accent:#f3a6b8;
  --accent-deep:#c2527e;
  --mint:#9fc9b8;
  --line:#f7c8d3;
}
*{box-sizing:border-box}
body{
  margin:0;
  padding:32px 18px 56px;
  color:var(--ink);
  font-family:"Microsoft YaHei","PingFang SC","Noto Sans CJK SC",sans-serif;
  background:
    radial-gradient(circle at 12% 8%,rgba(255,232,222,.9),transparent 30%),
    radial-gradient(circle at 88% 18%,rgba(216,238,230,.8),transparent 28%),
    linear-gradient(135deg,#fff4f6,#fffdf8 50%,#f5faf6);
}
.page{
  width:min(1180px,100%);
  margin:auto;
}
h1{
  margin:0 0 6px;
  color:var(--accent-deep);
  font-size:26px;
}
.intro{
  margin:0 0 22px;
  color:var(--muted);
  font-size:14px;
}
.compare{
  display:grid;
  grid-template-columns:repeat(2,minmax(0,1fr));
  gap:20px;
}
.demo{
  position:relative;
  min-height:330px;
  overflow:hidden;
  padding:42px 28px 34px;
  border:1px solid rgba(242,183,201,.7);
  border-radius:28px;
  background:
    linear-gradient(90deg,rgba(255,255,255,.28) 1px,transparent 1px) 0 0/34px 34px,
    linear-gradient(rgba(255,255,255,.25) 1px,transparent 1px) 0 0/34px 34px,
    linear-gradient(145deg,#fff9f6,#fffdf9 48%,#f7faf6);
  box-shadow:0 12px 28px rgba(104,73,87,.08);
}
.badge{
  position:absolute;
  top:15px;
  left:18px;
  padding:5px 11px;
  border-radius:999px;
  color:#fff;
  background:linear-gradient(135deg,var(--accent),var(--accent-deep));
  font-size:13px;
  font-weight:900;
}
.journal{
  display:grid;
  place-items:center;
  align-content:center;
  min-height:245px;
  text-align:center;
}
.journal-kicker{
  margin-bottom:9px;
  color:var(--accent);
  font-size:13px;
  letter-spacing:.28em;
  font-weight:900;
}
.journal-title-wrap{
  position:relative;
  display:inline-grid;
  place-items:center;
  max-width:100%;
  padding:0 20px 10px;
}
.journal-title{
  position:relative;
  z-index:1;
  max-width:520px;
  outline:0;
  font-size:42px;
  line-height:1.18;
  font-weight:900;
  overflow-wrap:anywhere;
}
.journal-subtitle{
  position:relative;
  margin-top:16px;
  max-width:480px;
  padding:0 34px;
  outline:0;
  color:var(--muted);
  font-size:19px;
  line-height:1.4;
  font-weight:800;
  overflow-wrap:anywhere;
}
.journal-subtitle::before,
.journal-subtitle::after{
  content:"♡";
  position:absolute;
  top:0;
  color:color-mix(in srgb,var(--accent) 62%,transparent);
  font-size:14px;
}
.journal-subtitle::before{left:6px}
.journal-subtitle::after{right:6px}
.journal-sparkles{
  margin-top:14px;
  color:color-mix(in srgb,var(--accent) 60%,transparent);
  font-size:13px;
  letter-spacing:1em;
}
.editable:empty::before{
  content:attr(data-placeholder);
  color:rgba(155,111,125,.38);
}

/* 方案1：干净连续高光条 */
.option-1 .journal-marker{
  position:absolute;
  left:5%;
  right:5%;
  bottom:7px;
  height:16px;
  z-index:0;
  border-radius:999px;
  background:linear-gradient(
    90deg,
    rgba(243,166,184,.24) 0%,
    rgba(243,166,184,.18) 58%,
    rgba(159,201,184,.16) 100%
  );
  transform:rotate(-1deg);
  filter:blur(.15px);
}

/* 方案2：单块不规则手帐笔刷 */
.option-2 .journal-marker{
  position:absolute;
  left:4%;
  right:4%;
  bottom:7px;
  height:18px;
  z-index:0;
  border-radius:999px;
  background:
    radial-gradient(ellipse at 4% 50%,
      rgba(243,166,184,.20) 0 52%,
      transparent 53%),
    radial-gradient(ellipse at 96% 50%,
      rgba(159,201,184,.15) 0 48%,
      transparent 49%),
    linear-gradient(
      90deg,
      rgba(243,166,184,.24) 0%,
      rgba(243,166,184,.18) 53%,
      rgba(159,201,184,.16) 100%
    );
  transform:rotate(-1deg) skewX(-1deg);
  filter:blur(.2px);
}
.option-2 .journal-marker::after{
  content:"";
  position:absolute;
  left:8%;
  right:11%;
  top:3px;
  height:11px;
  border-radius:999px;
  background:linear-gradient(
    90deg,
    rgba(255,255,255,.13),
    transparent 30% 70%,
    rgba(255,255,255,.08)
  );
  opacity:.75;
}

.caption{
  margin-top:18px;
  padding-top:12px;
  border-top:1px dashed rgba(217,95,140,.20);
  color:var(--muted);
  font-size:13px;
  line-height:1.6;
}
.controls{
  margin-top:20px;
  display:flex;
  flex-wrap:wrap;
  gap:8px;
}
.controls button{
  min-height:36px;
  border:1px solid rgba(217,95,140,.22);
  border-radius:999px;
  padding:0 13px;
  color:var(--accent-deep);
  background:rgba(255,255,255,.86);
  font-weight:800;
  cursor:pointer;
}
@media(max-width:820px){
  .compare{grid-template-columns:1fr}
  .journal-title{font-size:34px}
  .journal-subtitle{font-size:16px}
}
</style>
</head>
<body>
<main class="page">
  <h1>B方案高光底纹｜两种修正版</h1>
  <p class="intro">主标题、副标题都可以直接点击编辑。重点看高光底纹在短标题、长标题下是否自然。</p>

  <div class="compare">
    <section class="demo option-1">
      <span class="badge">方案1 · 连续高光条</span>
      <div class="journal">
        <div class="journal-kicker">VOICE LOG ✦ NOTE</div>
        <div class="journal-title-wrap">
          <span class="journal-marker"></span>
          <div class="journal-title editable" contenteditable="true" data-placeholder="填写主标题">我的上半年乙抓总结</div>
        </div>
        <div class="journal-subtitle editable" contenteditable="true" data-placeholder="填写副标题">其实没听多少</div>
        <div class="journal-sparkles">✦ · ♡ · ✦</div>
      </div>
      <div class="caption">更稳、更干净。底纹就是一整条连续高光，不再拼接左右补块。</div>
    </section>

    <section class="demo option-2">
      <span class="badge">方案2 · 手帐笔刷</span>
      <div class="journal">
        <div class="journal-kicker">VOICE LOG ✦ NOTE</div>
        <div class="journal-title-wrap">
          <span class="journal-marker"></span>
          <div class="journal-title editable" contenteditable="true" data-placeholder="填写主标题">我的上半年乙抓总结</div>
        </div>
        <div class="journal-subtitle editable" contenteditable="true" data-placeholder="填写副标题">其实没听多少</div>
        <div class="journal-sparkles">✦ · ♡ · ✦</div>
      </div>
      <div class="caption">稍微更像荧光笔/手帐刷痕，但仍然保持成一整块，不会出现矩形拼接感。</div>
    </section>
  </div>

  <div class="controls">
    <button data-title="近期BEST9" data-sub="最近喜欢的几张">测试短标题</button>
    <button data-title="那些让我听完以后立刻想再点开第二遍的乙抓个人总结" data-sub="不分先后，只记录这一阶段的个人偏好">测试长标题</button>
    <button data-title="一条ひらめ作品个人偏好记录" data-sub="完全主观，仅代表个人口味">测试无数字标题</button>
    <button data-title="我的上半年乙抓总结" data-sub="其实没听多少">恢复示例</button>
  </div>
</main>

<script>
const demos=[...document.querySelectorAll(".demo")];
document.querySelectorAll(".controls button").forEach(btn=>{
  btn.addEventListener("click",()=>{
    demos.forEach(d=>{
      d.querySelector(".journal-title").textContent=btn.dataset.title;
      d.querySelector(".journal-subtitle").textContent=btn.dataset.sub;
    });
  });
});
</script>
</body>
</html>
