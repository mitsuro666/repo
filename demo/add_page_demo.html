function fullHome(){return `<div class="home-grid"><div class="cover"></div><div class="panel info"><span class="panel-label">基本信息</span><div class="field"><label>CV</label><b>猿飛総司</b></div><div class="field"><label>社团</label><b>バニラレシピ</b></div><div class="field"><label>RJ号</label><b>RJ01943691</b></div><div class="field"><label>时长</label><b>79分</b></div><div class="choices"><span class="choice">字幕</span><span class="choice">视频</span><span class="choice">台本</span><span class="choice on">无中文</span></div></div><div class="panel title-panel"><span class="panel-label">标题</span><div class="title-text">よしよしカレシ ～お世話上手なツンデレ彼氏～ 特典トラック付</div></div><div class="panel tags-panel"><span class="panel-label">关键词</span><div class="tags"><span class="tag">HE</span><span class="tag">青梅竹马</span><span class="tag">初体验</span><span class="tag">＋</span></div></div><div class="panel price-panel"><span class="panel-label">价格</span><div class="fake-grid"><div class="mini"><small>原价</small><b>1540</b></div><div class="mini"><small>现价</small><b>154</b></div><div class="mini"><small>现折扣</small><b>90%off</b></div><div class="mini"><small>史低</small><b>90%off</b></div></div></div><div class="panel rating-panel"><span class="panel-label">评分</span><div style="margin-top:14px"><div class="rating-row"><span>总体</span><span class="stars">★★★★★</span><b>4.5</b></div><div class="rating-row"><span>CV</span><span class="stars">★★★★★</span><b>4.5</b></div><div class="rating-row"><span>剧本</span><span class="stars">★★★★★</span><b>5</b></div><div class="rating-row"><span>SE</span><span class="stars">★★★★☆</span><b>4</b></div></div></div><div class="panel review-panel"><span class="panel-label">评价</span><div class="review-text">很纯情的一本，“你”蛮积极的，男主是处，道德感拉满了就稍微强硬了一次hhh。这里故意放一段较长的示例文字，用来表现用户写到页面底部以后，马上就能看到下面的“＋ 添加续页”。</div></div></div>`}
function compactHome(){return `<div class="compact-home"><div class="compact-cover">BK</div><div class="compact-title">よしよしカレシ ～お世話上手なツンデレ彼氏～</div><div class="compact-info"><div><label>RJ号</label><b>RJ01943691</b></div><div><label>CV</label><b>猿飛総司</b></div><div><label>社团</label><b>バニラレシピ</b></div></div><div class="player"><div class="player-line"></div><div class="player-meta"><span>01:16</span><span>03:42</span></div></div></div>`}
function continuation(page,i){return `<div class="continuation"><div class="continuation-head"><div class="mini-cover">BK</div><div class="continuation-title"><h2>よしよしカレシ ～お世話上手なツンデレ彼氏～</h2><p>CV 猿飛総司　·　RJ01943691　·　${template==='full'?'完整版':'简略版'}</p></div><div class="page-stamp">${pad(i+1)}</div></div><div class="continuation-body"><textarea placeholder="继续写 Repo……">${esc(page.text||'')}</textarea></div></div>`}
function render(){const s=state(),p=s.pages[s.current];card.innerHTML=p.kind==='home'?(template==='full'?fullHome():compactHome()):continuation(p,s.current);const ta=card.querySelector('textarea');if(ta)ta.addEventListener('input',e=>p.text=e.target.value);countText.textContent=`${pad(s.current+1)} / ${pad(s.pages.length)}`;prev.disabled=s.current===0;next.disabled=s.current===s.pages.length-1;renderMenu()}
function renderMenu(){const s=state();menu.innerHTML='';s.pages.forEach((p,i)=>{const row=document.createElement('div');row.className='page-row'+(i===s.current?' active':'');const jump=document.createElement('button');jump.className='page-jump';jump.innerHTML=`${pad(i+1)} <small>${i===0?'首页':'续页'}</small>`;jump.onclick=()=>{s.current=i;menu.hidden=true;countBtn.setAttribute('aria-expanded','false');render()};row.appendChild(jump);if(i>0){const del=document.createElement('button');del.className='page-delete';del.textContent='×';del.title='删除这一页';del.onclick=e=>{e.stopPropagation();s.pages.splice(i,1);if(s.current>=s.pages.length)s.current=s.pages.length-1;else if(i<s.current)s.current--;render()};row.appendChild(del)}menu.appendChild(row)})}
function go(d){const s=state(),n=Math.max(0,Math.min(s.pages.length-1,s.current+d));if(n===s.current)return;s.current=n;render()}
prev.onclick=()=>go(-1);next.onclick=()=>go(1);countBtn.onclick=e=>{e.stopPropagation();menu.hidden=!menu.hidden;countBtn.setAttribute('aria-expanded',String(!menu.hidden))};document.addEventListener('click',e=>{if(!e.target.closest('#pageControl')){menu.hidden=true;countBtn.setAttribute('aria-expanded','false')}});add.onclick=()=>{const s=state();s.pages.push({kind:'continuation',text:''});s.current=s.pages.length-1;render();show(`已添加第 ${pad(s.current+1)} 页`)};
document.querySelectorAll('.template-btn').forEach(b=>b.onclick=()=>{document.querySelectorAll('.template-btn').forEach(x=>x.classList.remove('active'));b.classList.add('active');template=b.dataset.template;menu.hidden=true;render()});
const eTitle=document.getElementById('exportPageTitle'),eDesc=document.getElementById('exportPageDesc'),eCount=document.getElementById('exportCount'),ePrev=document.getElementById('exportPrev'),eNext=document.getElementById('exportNext');function renderExport(){const s=state();exportIndex=Math.max(0,Math.min(s.pages.length-1,exportIndex));eTitle.textContent=`${pad(exportIndex+1)} ${exportIndex===0?'首页':'续页'}`;eDesc.textContent=`${template==='full'?'完整版':'简略版'} · 当前导出预览`;eCount.textContent=`${pad(exportIndex+1)} / ${pad(s.pages.length)}`;ePrev.disabled=exportIndex===0;eNext.disabled=exportIndex===s.pages.length-1}document.getElementById('exportBtn').onclick=()=>{exportIndex=state().current;renderExport();modal.hidden=false};ePrev.onclick=()=>{if(exportIndex>0){exportIndex--;renderExport()}};eNext.onclick=()=>{if(exportIndex<state().pages.length-1){exportIndex++;renderExport()}};const close=()=>modal.hidden=true;document.getElementById('closeExport').onclick=close;document.getElementById('closeExport2').onclick=close;modal.onclick=e=>{if(e.target===modal)close()};document.getElementById('saveCurrent').onclick=()=>show(`Demo：保存 / 下载第 ${pad(exportIndex+1)} 页`);document.getElementById('saveAll').onclick=()=>show(`Demo：桌面端一次导出 ${state().pages.length} 张图片`);function show(t){toast.textContent=t;toast.classList.add('show');clearTimeout(show.t);show.t=setTimeout(()=>toast.classList.remove('show'),1800)}render()})();
</script></body></html>
