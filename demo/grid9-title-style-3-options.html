<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>九宫格标题区三方案 Demo</title>
<style>
:root{
  --ink:#684957;
  --muted:#9b6f7d;
  --accent:#f3a6b8;
  --accent-deep:#c2527e;
  --mint:#9fc9b8;
  --line:#f7c8d3;
  --paper:#fffaf7;
}
*{box-sizing:border-box}
body{
  margin:0;
  padding:34px 18px 60px;
  color:var(--ink);
  font-family:"Microsoft YaHei","PingFang SC","Noto Sans CJK SC",sans-serif;
  background:
    radial-gradient(circle at 12% 8%,rgba(255,232,222,.9),transparent 30%),
    radial-gradient(circle at 88% 18%,rgba(216,238,230,.8),transparent 28%),
    linear-gradient(135deg,#fff4f6,#fffdf8 50%,#f5faf6);
}
.page{
  width:min(1100px,100%);
  margin:auto;
}
h1{
  margin:0 0 6px;
  color:var(--accent-deep);
  font-size:26px;
}
.intro{
  margin:0 0 22px;
  color:var(--muted);
  font-size:14px;
}
.grid{
  display:grid;
  gap:20px;
}
.demo{
  position:relative;
  min-height:300px;
  overflow:hidden;
  padding:34px 38px 32px;
  border:1px solid rgba(242,183,201,.7);
  border-radius:28px;
  background:
    linear-gradient(90deg,rgba(255,255,255,.28) 1px,transparent 1px) 0 0/34px 34px,
    linear-gradient(rgba(255,255,255,.25) 1px,transparent 1px) 0 0/34px 34px,
    linear-gradient(145deg,#fff9f6,#fffdf9 48%,#f7faf6);
  box-shadow:0 12px 28px rgba(104,73,87,.08);
}
.badge{
  position:absolute;
  top:15px;
  left:18px;
  padding:5px 11px;
  border-radius:999px;
  color:#fff;
  background:linear-gradient(135deg,var(--accent),var(--accent-deep));
  font-size:13px;
  font-weight:900;
}
.editable{
  outline:0;
  cursor:text;
}
.editable:empty::before{
  content:attr(data-placeholder);
  color:rgba(155,111,125,.38);
}
.note{
  position:absolute;
  right:18px;
  bottom:13px;
  color:rgba(155,111,125,.65);
  font-size:12px;
}

/* ========== A 数字强调型 ========== */
.numeric{
  display:grid;
  place-items:center;
  align-content:center;
  min-height:230px;
  text-align:center;
}
.numeric-title{
  position:relative;
  max-width:880px;
  font-size:50px;
  line-height:1.18;
  font-weight:900;
  overflow-wrap:anywhere;
}
.numeric-title .number{
  color:var(--accent-deep);
  font-size:1.12em;
  letter-spacing:.02em;
}
.numeric-title .rest{
  color:var(--ink);
}
.numeric-accent{
  width:92px;
  height:5px;
  margin:15px auto 11px;
  border-radius:999px;
  background:linear-gradient(90deg,var(--accent),var(--mint));
}
.numeric-subtitle{
  max-width:760px;
  color:var(--muted);
  font-size:20px;
  line-height:1.4;
  font-weight:800;
  overflow-wrap:anywhere;
}
.numeric-hint{
  margin-top:13px;
  color:rgba(155,111,125,.55);
  font-size:11px;
}
/* 自动强调采用 contenteditable 内 span，只是 Demo 演示。
   正式项目如果文案任意，建议不要强依赖“必须有数字”。 */


/* ========== B 手帐标题 ========== */
.journal{
  display:grid;
  place-items:center;
  align-content:center;
  min-height:230px;
  text-align:center;
}
.journal-kicker{
  margin-bottom:9px;
  color:var(--accent);
  font-size:13px;
  letter-spacing:.28em;
  font-weight:900;
}
.journal-title-wrap{
  position:relative;
  display:inline-grid;
  place-items:center;
  max-width:890px;
  padding:0 25px 4px;
}
.journal-marker{
  position:absolute;
  left:4%;
  right:4%;
  bottom:2px;
  height:22px;
  z-index:0;
  border-radius:48% 54% 45% 52%;
  background:linear-gradient(
    90deg,
    color-mix(in srgb,var(--accent) 24%,transparent),
    color-mix(in srgb,var(--accent) 14%,transparent) 55%,
    color-mix(in srgb,var(--mint) 18%,transparent)
  );
  transform:rotate(-1deg);
}
.journal-marker::before,
.journal-marker::after{
  content:"";
  position:absolute;
  top:3px;
  width:30px;
  height:15px;
  background:inherit;
  filter:blur(.3px);
}
.journal-marker::before{left:-9px;transform:rotate(5deg)}
.journal-marker::after{right:-8px;transform:rotate(-6deg)}
.journal-title{
  position:relative;
  z-index:1;
  max-width:840px;
  font-size:49px;
  line-height:1.2;
  font-weight:900;
  overflow-wrap:anywhere;
}
.journal-subtitle{
  position:relative;
  margin-top:17px;
  max-width:760px;
  padding:0 35px;
  color:var(--muted);
  font-size:20px;
  line-height:1.4;
  font-weight:800;
}
.journal-subtitle::before,
.journal-subtitle::after{
  content:"♡";
  position:absolute;
  top:0;
  color:color-mix(in srgb,var(--accent) 62%,transparent);
  font-size:15px;
}
.journal-subtitle::before{left:7px}
.journal-subtitle::after{right:7px}
.journal-sparkles{
  margin-top:15px;
  color:color-mix(in srgb,var(--accent) 60%,transparent);
  font-size:13px;
  letter-spacing:1em;
}


/* ========== C 左右角装饰 ========== */
.corner{
  position:relative;
  display:grid;
  place-items:center;
  align-content:center;
  min-height:230px;
  padding:0 80px;
  text-align:center;
}
.corner-deco{
  position:absolute;
  width:120px;
  height:54px;
  color:var(--accent);
  opacity:.72;
}
.corner-deco.left{
  left:24px;
  top:57px;
}
.corner-deco.right{
  right:24px;
  bottom:51px;
  transform:rotate(180deg);
}
.corner-deco::before{
  content:"";
  position:absolute;
  left:0;
  top:25px;
  width:86px;
  height:1px;
  background:linear-gradient(90deg,currentColor,transparent);
}
.corner-deco::after{
  content:"♡  ✦";
  position:absolute;
  left:4px;
  top:5px;
  font-size:15px;
  letter-spacing:7px;
}
.corner-title{
  max-width:780px;
  font-size:50px;
  line-height:1.2;
  font-weight:900;
  overflow-wrap:anywhere;
}
.corner-subtitle{
  position:relative;
  margin-top:13px;
  max-width:700px;
  padding:0 52px;
  color:var(--muted);
  font-size:20px;
  line-height:1.4;
  font-weight:800;
  overflow-wrap:anywhere;
}
.corner-subtitle::before,
.corner-subtitle::after{
  content:"";
  position:absolute;
  top:50%;
  width:34px;
  border-top:1.5px solid color-mix(in srgb,var(--accent) 42%,transparent);
}
.corner-subtitle::before{left:6px}
.corner-subtitle::after{right:6px}
.corner-footer{
  width:440px;
  max-width:65%;
  margin-top:19px;
  display:grid;
  grid-template-columns:1fr auto 1fr;
  align-items:center;
  gap:12px;
  color:var(--accent);
}
.corner-footer::before,
.corner-footer::after{
  content:"";
  border-top:1.5px dashed color-mix(in srgb,var(--accent) 46%,transparent);
}
.corner-footer span{
  font-size:15px;
}

/* helper controls */
.controls{
  margin-top:20px;
  display:flex;
  gap:8px;
  flex-wrap:wrap;
}
.controls button{
  min-height:36px;
  border:1px solid rgba(217,95,140,.22);
  border-radius:999px;
  padding:0 13px;
  color:var(--accent-deep);
  background:rgba(255,255,255,.86);
  font-weight:800;
  cursor:pointer;
}

@media(max-width:700px){
  body{padding:18px 10px 40px}
  .demo{padding:36px 18px 30px}
  .numeric-title,.journal-title,.corner-title{font-size:34px}
  .numeric-subtitle,.journal-subtitle,.corner-subtitle{font-size:16px}
  .corner{padding:0 34px}
  .corner-deco{transform:scale(.75)}
  .corner-deco.right{transform:rotate(180deg) scale(.75)}
}
</style>
</head>
<body>
<main class="page">
  <h1>九宫格标题区｜三种可编辑方案</h1>
  <p class="intro">直接点击主标题和副标题改字。可以试长标题、短标题、纯中文、带数字、不带数字，看看哪套最稳。</p>

  <section class="grid">

    <article class="demo">
      <span class="badge">A · 数字强调型</span>
      <div class="numeric">
        <div class="numeric-title editable" id="numericTitle" contenteditable="true">
          <span class="number">2026</span><span class="rest">上半年总结</span>
        </div>
        <div class="numeric-accent"></div>
        <div class="numeric-subtitle editable" contenteditable="true" data-placeholder="填写副标题">其实没听多少</div>
        <div class="numeric-hint">Demo 自动强调开头数字；没有数字时会按普通标题显示</div>
      </div>
      <span class="note">偏榜单 / 年度总结感</span>
    </article>

    <article class="demo">
      <span class="badge">B · 手帐标题</span>
      <div class="journal">
        <div class="journal-kicker">VOICE LOG ✦ NOTE</div>
        <div class="journal-title-wrap">
          <span class="journal-marker"></span>
          <div class="journal-title editable" contenteditable="true" data-placeholder="填写主标题">我的上半年乙抓总结</div>
        </div>
        <div class="journal-subtitle editable" contenteditable="true" data-placeholder="填写副标题">其实没听多少</div>
        <div class="journal-sparkles">✦ · ♡ · ✦</div>
      </div>
      <span class="note">偏手帐 / 收藏记录感</span>
    </article>

    <article class="demo">
      <span class="badge">C · 左右角装饰</span>
      <div class="corner">
        <span class="corner-deco left"></span>
        <span class="corner-deco right"></span>
        <div class="corner-title editable" contenteditable="true" data-placeholder="填写主标题">一条ひらめ BEST9</div>
        <div class="corner-subtitle editable" contenteditable="true" data-placeholder="填写副标题">不分先后 · 完全个人喜好</div>
        <div class="corner-footer"><span>✦</span></div>
      </div>
      <span class="note">对任意文案适应性最好</span>
    </article>

  </section>

  <div class="controls">
    <button id="shortBtn">测试短标题</button>
    <button id="longBtn">测试超长标题</button>
    <button id="noNumBtn">测试无数字标题</button>
    <button id="resetBtn">恢复示例</button>
  </div>
</main>

<script>
const numTitle=document.getElementById("numericTitle");

function renderNumericTitle(text){
  const clean=(text||"").trim();
  const match=clean.match(/^(\d{2,4})(.*)$/s);
  numTitle.innerHTML="";
  if(match){
    const a=document.createElement("span");
    a.className="number";
    a.textContent=match[1];
    const b=document.createElement("span");
    b.className="rest";
    b.textContent=match[2] || "";
    numTitle.append(a,b);
  }else{
    const b=document.createElement("span");
    b.className="rest";
    b.textContent=clean;
    numTitle.append(b);
  }
}
numTitle.addEventListener("input",()=>{
  /* contenteditable 中不实时重构 DOM，避免打字光标跳动 */
});
numTitle.addEventListener("blur",()=>renderNumericTitle(numTitle.innerText));

const journalTitle=document.querySelector(".journal-title");
const cornerTitle=document.querySelector(".corner-title");
const subtitles=[...document.querySelectorAll(".numeric-subtitle,.journal-subtitle,.corner-subtitle")];

function setTitles(a,b,c,sub){
  renderNumericTitle(a);
  journalTitle.textContent=b;
  cornerTitle.textContent=c;
  subtitles.forEach(x=>x.textContent=sub);
}
document.getElementById("shortBtn").onclick=()=>setTitles("2026 BEST9","近期BEST9","我的BEST9","最近喜欢的几张");
document.getElementById("longBtn").onclick=()=>setTitles(
  "2026上半年最想反复重听的乙抓个人主观总结",
  "那些让我听完以后立刻想再点开第二遍的乙抓",
  "XXX声优作品里我个人最喜欢的九张完全主观BEST9",
  "不分先后，只记录这一阶段的个人偏好"
);
document.getElementById("noNumBtn").onclick=()=>setTitles(
  "我的上半年乙抓总结",
  "一条ひらめ作品个人偏好记录",
  "青梅竹马系我最喜欢的九张",
  "完全主观，仅代表个人口味"
);
document.getElementById("resetBtn").onclick=()=>setTitles(
  "2026上半年总结",
  "我的上半年乙抓总结",
  "一条ひらめ BEST9",
  "其实没听多少"
);
</script>
</body>
</html>
