<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>乙抓记录｜九宫格模板 Demo</title>
<style>
:root{--ink:#684957;--muted:#9b6f7d;--accent:#f4abb9;--accent-deep:#b84f78;--line:#fec9d4;--dash:#9bc4b2;--cover-bg:#ffe5d9;--bg-a:#fff8f4;--bg-b:#fffdf9;--bg-c:#f5f8f4;--shadow:0 18px 45px rgba(123,68,91,.18)}
*{box-sizing:border-box}body{margin:0;color:var(--ink);font-family:"Microsoft YaHei","PingFang SC","Noto Sans CJK SC",Arial,sans-serif;background:radial-gradient(circle at 12% 8%,rgba(255,238,220,.95),transparent 30%),radial-gradient(circle at 88% 18%,rgba(214,235,229,.9),transparent 28%),linear-gradient(135deg,#fff1f5 0%,#f8fbf4 48%,#fff8ed 100%)}button,input,textarea{font:inherit}
.demo-shell{min-height:100vh;padding:28px 18px 56px;display:grid;justify-items:center;gap:18px}.demo-heading{width:min(100%,1080px);display:flex;align-items:end;justify-content:space-between;gap:14px}.demo-heading h1{margin:0;color:var(--accent-deep);font-size:24px}.demo-heading p{margin:0;color:var(--muted);font-size:13px}.preview-wrap{width:min(100%,1080px);display:grid;justify-items:center}.scaler{width:1080px;height:1440px;transform-origin:top left}
.grid9-card{position:relative;width:1080px;height:1440px;overflow:hidden;border-radius:44px;box-shadow:var(--shadow);background:linear-gradient(90deg,rgba(255,255,255,.36) 1px,transparent 1px) 0 0/36px 36px,linear-gradient(rgba(255,255,255,.32) 1px,transparent 1px) 0 0/36px 36px,linear-gradient(145deg,var(--bg-a) 0%,var(--bg-b) 48%,var(--bg-c) 100%);padding:44px 58px 52px}.grid9-card::before{content:"";position:absolute;inset:16px;border:3px solid color-mix(in srgb,var(--line) 78%,transparent);border-radius:30px;pointer-events:none}.grid9-card::after{content:"";position:absolute;inset:30px;border:2px dashed color-mix(in srgb,var(--dash) 62%,transparent);border-radius:22px;pointer-events:none}
.grid9-header{position:relative;z-index:1;height:158px;text-align:center}.grid9-header-tools{position:absolute;top:-4px;left:0;display:flex;align-items:center;gap:18px;color:var(--muted);font-size:14px;font-weight:800}.grid9-toggle{display:inline-flex;align-items:center;gap:6px;cursor:pointer;user-select:none}.grid9-toggle input{width:16px;height:16px;accent-color:var(--accent-deep)}.grid9-title,.grid9-subtitle{outline:none;border:0}.grid9-title{padding-top:14px;min-height:64px;color:var(--ink);font-size:52px;line-height:1.1;font-weight:900}.grid9-subtitle{margin-top:6px;min-height:30px;color:var(--muted);font-size:23px;line-height:1.2;font-weight:800}.grid9-title:empty::before,.grid9-subtitle:empty::before{content:attr(data-placeholder);color:color-mix(in srgb,var(--muted) 46%,transparent)}.grid9-divider{width:560px;margin:14px auto 0;display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:12px;color:var(--accent)}.grid9-divider::before,.grid9-divider::after{content:"";border-top:2px dashed color-mix(in srgb,var(--accent) 50%,transparent)}.grid9-divider span{width:12px;height:12px;display:block;background:currentColor;transform:rotate(45deg);border-radius:2px}
.grid9-grid{position:relative;z-index:1;height:1160px;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));grid-template-rows:repeat(3,minmax(0,1fr));gap:20px 18px}.grid9-cell{min-width:0;display:grid;grid-template-rows:40px 250px 92px;gap:10px;align-content:start}.grid9-tag-input{width:100%;height:40px;border:0;border-radius:999px;padding:0 14px;outline:0;color:#fff;text-align:center;font-size:18px;font-weight:900;background:linear-gradient(135deg,var(--accent),var(--accent-deep));box-shadow:0 5px 12px color-mix(in srgb,var(--accent-deep) 15%,transparent)}.grid9-tag-input::placeholder{color:rgba(255,255,255,.76)}
.grid9-cover-box{position:relative;width:100%;height:250px;border-radius:16px;overflow:hidden;cursor:pointer;background:color-mix(in srgb,var(--cover-bg) 52%,white);border:2px dashed color-mix(in srgb,var(--accent) 44%,transparent);transition:transform .14s ease,box-shadow .14s ease}.grid9-cover-box:hover{transform:translateY(-1px)}.grid9-cover-box.has-image{border:3px solid rgba(255,255,255,.96);box-shadow:0 0 0 1px color-mix(in srgb,var(--line) 78%,transparent),0 8px 18px rgba(104,73,87,.13)}.grid9-cover-input{display:none}.grid9-cover-image{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:none}.grid9-cover-box.has-image .grid9-cover-image{display:block}.grid9-cover-placeholder{position:absolute;inset:0;display:grid;place-items:center;color:var(--muted);font-size:18px;font-weight:900}.grid9-cover-box.has-image .grid9-cover-placeholder{display:none}.grid9-cover-box.has-image::after{content:"点击编辑图片";position:absolute;left:50%;bottom:10px;transform:translateX(-50%);opacity:0;pointer-events:none;color:#fff;background:rgba(93,64,81,.58);padding:4px 10px;border-radius:999px;font-size:12px;font-weight:800;transition:opacity .14s ease}.grid9-cover-box.has-image:hover::after{opacity:1}
.grid9-number{position:absolute;top:9px;left:9px;z-index:3;width:34px;height:34px;border-radius:50%;display:grid;place-items:center;background:rgba(255,255,255,.94);border:2px solid color-mix(in srgb,var(--accent) 72%,transparent);color:var(--accent-deep);font-size:16px;font-weight:900;box-shadow:0 3px 9px rgba(104,73,87,.10);pointer-events:none}.hide-numbers .grid9-number{display:none}.grid9-rj-input{position:absolute;right:9px;bottom:9px;z-index:3;width:116px;height:24px;border:0;border-radius:7px;padding:0 7px;outline:0;color:var(--accent-deep);background:rgba(255,255,255,.82);backdrop-filter:blur(4px);box-shadow:0 2px 8px rgba(104,73,87,.10);text-align:right;font-size:11px;font-weight:800}.grid9-rj-input::placeholder{color:color-mix(in srgb,var(--muted) 72%,transparent)}.hide-rj .grid9-rj-input{opacity:.34}.hide-rj .grid9-rj-input:focus{opacity:1}
.grid9-review-wrap{position:relative;min-height:92px;padding:11px 10px 8px 19px;background:linear-gradient(90deg,color-mix(in srgb,var(--accent) 18%,transparent) 0 3px,transparent 3px 100%)}.grid9-review-wrap::before{content:"❝";position:absolute;left:2px;top:3px;color:color-mix(in srgb,var(--accent-deep) 50%,transparent);font-size:18px;font-weight:900}.grid9-review-wrap::after{content:"✦";position:absolute;right:2px;bottom:-1px;color:color-mix(in srgb,var(--accent) 58%,transparent);font-size:12px}.grid9-review-input{width:100%;height:68px;resize:none;overflow:hidden;border:0;border-bottom:1.5px solid color-mix(in srgb,var(--accent) 38%,transparent);outline:0;padding:0 2px 5px 0;color:var(--ink);background:transparent;font-size:15px;line-height:1.45;font-weight:700}.grid9-review-input::placeholder{color:color-mix(in srgb,var(--muted) 52%,transparent)}.grid9-watermark{position:absolute;z-index:1;right:54px;bottom:34px;color:color-mix(in srgb,var(--ink) 9%,transparent);font-size:13px;letter-spacing:.14em;font-weight:800;pointer-events:none}
.grid9-external-tools{width:min(100%,1080px);display:flex;justify-content:center;align-items:center;gap:10px;flex-wrap:wrap;padding:12px 14px;border:1px solid rgba(217,95,140,.18);border-radius:18px;background:rgba(255,255,255,.68);box-shadow:0 10px 24px rgba(184,69,112,.10);backdrop-filter:blur(12px)}.tool-button{min-height:38px;border:1px solid rgba(217,95,140,.28);border-radius:999px;padding:0 16px;color:var(--accent-deep);background:rgba(255,255,255,.9);cursor:pointer;font-weight:900}.tool-button.primary{color:#fff;border-color:transparent;background:linear-gradient(135deg,var(--accent),var(--accent-deep))}.preset-wrap{position:relative}.preset-menu{position:absolute;left:50%;bottom:calc(100% + 8px);transform:translateX(-50%);width:170px;display:grid;gap:6px;padding:8px;border:1px solid rgba(217,95,140,.2);border-radius:14px;background:rgba(255,255,255,.97);box-shadow:0 12px 26px rgba(104,73,87,.14);z-index:20}.preset-menu[hidden]{display:none}.preset-item{min-height:34px;border:0;border-radius:10px;color:var(--ink);background:rgba(255,244,248,.74);cursor:pointer;font-weight:800}
.edit-modal{position:fixed;inset:0;z-index:100;display:grid;place-items:center;padding:20px;background:rgba(59,42,50,.30);backdrop-filter:blur(7px)}.edit-modal[hidden]{display:none}.edit-sheet{width:min(92vw,520px);border-radius:22px;padding:18px;background:#fffafc;box-shadow:0 22px 60px rgba(71,45,57,.26)}.edit-sheet h2{margin:0 0 10px;color:var(--accent-deep);font-size:20px}.edit-preview{width:100%;aspect-ratio:4/3;overflow:hidden;border-radius:16px;background:var(--cover-bg);border:2px solid white;box-shadow:0 0 0 1px var(--line)}.edit-preview img{width:100%;height:100%;object-fit:cover}.edit-note{margin:12px 0;color:var(--muted);font-size:13px;line-height:1.6}.edit-actions{display:flex;justify-content:flex-end;gap:8px}
@media(max-width:900px){.demo-heading{display:block}.demo-heading p{margin-top:5px}}
</style>
</head>
<body>
<div class="demo-shell">
  <div class="demo-heading"><div><h1>九宫格模板 · 新版结构 Demo</h1><p>1080 × 1440 / 3:4。预览缩放不影响导出尺寸。</p></div></div>
  <div class="preview-wrap" id="previewWrap"><div class="scaler" id="scaler"><section class="grid9-card" id="grid9Card">
    <header class="grid9-header">
      <div class="grid9-header-tools"><label class="grid9-toggle"><input id="showNumbers" type="checkbox" checked> 显示编号</label><label class="grid9-toggle"><input id="showRj" type="checkbox" checked> 显示RJ号</label></div>
      <div class="grid9-title" contenteditable="true" data-placeholder="填写大标题">2026上半年乙抓总结</div>
      <div class="grid9-subtitle" contenteditable="true" data-placeholder="填写副标题（可选）">其实没听多少</div>
      <div class="grid9-divider"><span></span></div>
    </header>
    <div class="grid9-grid" id="grid9Grid"></div><div class="grid9-watermark">乙抓记录 · OTOME VOICE LOG</div>
  </section></div></div>
  <div class="grid9-external-tools"><button class="tool-button primary" id="importAllBtn">按RJ一键导入BK</button><div class="preset-wrap"><button class="tool-button" id="presetBtn">短标题预设 ▾</button><div class="preset-menu" id="presetMenu" hidden><button class="preset-item" data-preset="summary">总结型</button><button class="preset-item" data-preset="voice">声优 BEST9</button><button class="preset-item" data-preset="clear">清空短标题</button></div></div></div>
</div>
<div class="edit-modal" id="editModal" hidden><div class="edit-sheet"><h2>编辑当前 BK</h2><div class="edit-preview"><img id="editPreview" alt=""></div><p class="edit-note">这个 Demo 只演示“9 格共用一套编辑弹窗”的交互。嵌入正式项目时，点击已有 BK 应复用现有的马赛克 / 模糊 / 贴纸修图器，不要创建 9 套 Canvas。</p><div class="edit-actions"><button class="tool-button" id="replaceBtn">替换图片</button><button class="tool-button primary" id="closeEditBtn">完成</button></div></div></div>
<script>
const presets={summary:["最喜欢","最惊喜","最催眠","最适合睡前","最想二刷","最上头","最会撩","最戳XP","最想安利"],voice:["最喜欢","最温柔","最催眠","最反差","最耐听","最上头","最会撩","最有记忆点","最推荐"]};
const grid9Card=document.getElementById("grid9Card"),grid9Grid=document.getElementById("grid9Grid"),showNumbers=document.getElementById("showNumbers"),showRj=document.getElementById("showRj"),presetBtn=document.getElementById("presetBtn"),presetMenu=document.getElementById("presetMenu"),editModal=document.getElementById("editModal"),editPreview=document.getElementById("editPreview"),replaceBtn=document.getElementById("replaceBtn"),closeEditBtn=document.getElementById("closeEditBtn"),importAllBtn=document.getElementById("importAllBtn");let activeIndex=-1;
function makeDemoCover(index){const p=[["#f8c5d2","#75546a"],["#c8d7ef","#526786"],["#eed1cf","#9c6a72"],["#d0deef","#526276"],["#f5dfc8","#8e6f58"],["#d5d4e7","#55506d"],["#dfd1ef","#725d8f"],["#ecd7c4","#826452"],["#ccd5de","#536270"]][index%9],a=p[0],b=p[1];const svg=`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 450"><defs><linearGradient id="g" x1="0" x2="1" y1="0" y2="1"><stop stop-color="${a}"/><stop offset="1" stop-color="#fff9fb"/></linearGradient></defs><rect width="600" height="450" fill="url(#g)"/><circle cx="430" cy="110" r="95" fill="${b}" opacity=".16"/><circle cx="170" cy="330" r="120" fill="${b}" opacity=".10"/><path d="M255 350c12-120 28-215 115-222 82-6 127 70 112 157-10 59-43 103-105 118-51 12-93-8-122-53z" fill="${b}" opacity=".82"/><circle cx="370" cy="170" r="69" fill="#f8e0d4"/><path d="M313 172c9-85 113-89 126-4-26-36-89-40-126 4z" fill="${b}"/><text x="42" y="62" font-family="Arial,sans-serif" font-size="30" font-weight="700" fill="${b}">OTOME VOICE</text><text x="43" y="98" font-family="Arial,sans-serif" font-size="18" fill="${b}" opacity=".75">sample cover ${index+1}</text></svg>`;return "data:image/svg+xml;charset=utf-8,"+encodeURIComponent(svg)}
function buildCells(){for(let i=0;i<9;i++){const cell=document.createElement("article");cell.className="grid9-cell";cell.dataset.index=i;const tag=document.createElement("input");tag.className="grid9-tag-input";tag.maxLength=8;tag.value=presets.summary[i]||"";tag.placeholder="短标题";const cover=document.createElement("label");cover.className="grid9-cover-box";const file=document.createElement("input");file.type="file";file.accept="image/*";file.className="grid9-cover-input";const img=document.createElement("img");img.className="grid9-cover-image";img.alt="";const placeholder=document.createElement("span");placeholder.className="grid9-cover-placeholder";placeholder.textContent="点击上传 BK";const num=document.createElement("span");num.className="grid9-number";num.textContent=String(i+1);const rj=document.createElement("input");rj.className="grid9-rj-input";rj.placeholder="RJ号";rj.maxLength=12;rj.value=i<3?["RJ01152097","RJ01490772","RJ01508526"][i]:"";rj.addEventListener("click",e=>{e.preventDefault();e.stopPropagation()});rj.addEventListener("pointerdown",e=>e.stopPropagation());cover.append(file,img,placeholder,num,rj);const reviewWrap=document.createElement("div");reviewWrap.className="grid9-review-wrap";const review=document.createElement("textarea");review.className="grid9-review-input";review.rows=3;review.maxLength=72;review.placeholder="短评，最多三行";if(i===0)review.value="声音特别贴，剧情节奏也很顺。\n第一遍就很喜欢，二刷依旧上头。";reviewWrap.append(review);cell.append(tag,cover,reviewWrap);grid9Grid.append(cell);file.addEventListener("change",()=>{const f=file.files&&file.files[0];file.value="";if(!f)return;const reader=new FileReader();reader.onload=()=>{img.src=reader.result;cover.classList.add("has-image")};reader.readAsDataURL(f)});cover.addEventListener("click",e=>{if(e.target.closest(".grid9-rj-input"))return;if(cover.classList.contains("has-image")){e.preventDefault();activeIndex=i;editPreview.src=img.src;editModal.hidden=false}});if(i===0){img.src=makeDemoCover(i);cover.classList.add("has-image")}}}
showNumbers.addEventListener("change",()=>grid9Card.classList.toggle("hide-numbers",!showNumbers.checked));showRj.addEventListener("change",()=>grid9Card.classList.toggle("hide-rj",!showRj.checked));presetBtn.addEventListener("click",()=>presetMenu.hidden=!presetMenu.hidden);presetMenu.addEventListener("click",e=>{const b=e.target.closest("[data-preset]");if(!b)return;const key=b.dataset.preset,inputs=[...document.querySelectorAll(".grid9-tag-input")];if(key==="clear")inputs.forEach(x=>x.value="");else inputs.forEach((x,i)=>x.value=(presets[key]||[])[i]||"");presetMenu.hidden=true});closeEditBtn.addEventListener("click",()=>editModal.hidden=true);editModal.addEventListener("click",e=>{if(e.target===editModal)editModal.hidden=true});replaceBtn.addEventListener("click",()=>{if(activeIndex<0)return;const f=document.querySelectorAll(".grid9-cover-input")[activeIndex];editModal.hidden=true;f.click()});importAllBtn.addEventListener("click",()=>{const cells=[...document.querySelectorAll(".grid9-cell")];let imported=0;cells.forEach((cell,i)=>{const rj=cell.querySelector(".grid9-rj-input").value.trim(),box=cell.querySelector(".grid9-cover-box"),img=cell.querySelector(".grid9-cover-image");if(!rj||box.classList.contains("has-image"))return;img.src=makeDemoCover(i);box.classList.add("has-image");imported++});importAllBtn.textContent=`已导入 ${imported} 张`;setTimeout(()=>importAllBtn.textContent="按RJ一键导入BK",1200)});
function fitPreview(){const wrap=document.getElementById("previewWrap"),scaler=document.getElementById("scaler"),scale=Math.min(1,wrap.clientWidth/1080);scaler.style.transform=`scale(${scale})`;wrap.style.height=(1440*scale)+"px"}buildCells();fitPreview();window.addEventListener("resize",fitPreview);
</script>
</body>
</html>
